<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Dove finiscono i log sulla macchina</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Quattro posti da conoscere</text>
<rect x="70" y="190" width="715" height="320" rx="14" fill="#FFFFFF" stroke="#1C64C8" stroke-width="3"/>
<rect x="70" y="190" width="14" height="320" rx="7" fill="#1C64C8"/>
<text xml:space="preserve" x="110" y="245" font-size="36" fill="#1C64C8" font-weight="bold">systemd-journald</text>
<text xml:space="preserve" x="110" y="295" font-size="28" fill="#1F2933">binario, si legge solo con journalctl</text>
<text xml:space="preserve" x="110" y="335" font-size="28" fill="#1F2933">è il default delle distribuzioni recenti</text>
<rect x="100" y="430" width="655" height="56" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="132" y="464" font-size="22" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ journalctl -u ssh -f</text>
<rect x="815" y="190" width="715" height="320" rx="14" fill="#FFFFFF" stroke="#0C8599" stroke-width="3"/>
<rect x="815" y="190" width="14" height="320" rx="7" fill="#0C8599"/>
<text xml:space="preserve" x="855" y="245" font-size="36" fill="#0C8599" font-weight="bold">syslog (rsyslog)</text>
<text xml:space="preserve" x="855" y="295" font-size="28" fill="#1F2933">testo, in /var/log/syslog e /var/log/auth.log</text>
<text xml:space="preserve" x="855" y="335" font-size="28" fill="#1F2933">si legge con cat, grep, tail</text>
<rect x="845" y="430" width="655" height="56" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="877" y="464" font-size="22" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ tail -f /var/log/auth.log</text>
<rect x="70" y="540" width="715" height="320" rx="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="3"/>
<rect x="70" y="540" width="14" height="320" rx="7" fill="#B7791F"/>
<text xml:space="preserve" x="110" y="595" font-size="36" fill="#B7791F" font-weight="bold">file dell'applicazione</text>
<text xml:space="preserve" x="110" y="645" font-size="28" fill="#1F2933">in /var/log o dove decide l'applicazione</text>
<text xml:space="preserve" x="110" y="685" font-size="28" fill="#1F2933">es. Apache, Nginx, Postfix</text>
<rect x="100" y="780" width="655" height="56" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="132" y="814" font-size="22" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ tail -f /var/log/apache2/access.log</text>
<rect x="815" y="540" width="715" height="320" rx="14" fill="#FFFFFF" stroke="#2496ED" stroke-width="3"/>
<rect x="815" y="540" width="14" height="320" rx="7" fill="#2496ED"/>
<text xml:space="preserve" x="855" y="595" font-size="36" fill="#2496ED" font-weight="bold">log di Docker</text>
<text xml:space="preserve" x="855" y="645" font-size="28" fill="#1F2933">stdout e stderr del container</text>
<text xml:space="preserve" x="855" y="685" font-size="28" fill="#1F2933">2&gt;&amp;1 per passarli entrambi a grep</text>
<rect x="845" y="780" width="655" height="54" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="877" y="813" font-size="20" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker logs -f grafana 2&gt;&amp;1 | grep -i error</text>
</svg>

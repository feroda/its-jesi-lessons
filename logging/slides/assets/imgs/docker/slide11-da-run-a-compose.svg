<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="72" font-size="40" font-weight="bold" fill="#1F2933">Da docker run a compose.yml</text>
  <text x="60" y="110" font-size="22" fill="#52606D">Lo stesso container, scritto in un file invece che in una riga lunghissima</text>

  <!-- Comando -->
  <text x="60" y="175" font-size="22" font-weight="bold" fill="#1F2933">Prima: un comando da ricordare</text>
  <rect x="60" y="195" width="1480" height="80" rx="12" fill="#1F2933"/>
  <text xml:space="preserve" x="85" y="245" font-size="21" font-family="DejaVu Sans Mono, monospace" fill="#FFFFFF">$ docker run -d <tspan fill="#C2255C" font-weight="bold">--name web-07</tspan> <tspan fill="#0C8599" font-weight="bold">-p 8007:80</tspan> <tspan fill="#B7791F" font-weight="bold">-v ~/web/sito:/usr/share/nginx/html:ro</tspan> <tspan fill="#2496ED" font-weight="bold">nginx:alpine</tspan></text>

  <!-- compose.yml -->
  <text x="60" y="345" font-size="22" font-weight="bold" fill="#1F2933">Dopo: ~/web/compose.yml</text>
  <rect x="60" y="365" width="760" height="440" rx="12" fill="#F5F7FA" stroke="#3E4C59" stroke-width="3"/>
  <g font-size="22" font-family="DejaVu Sans Mono, monospace" fill="#1F2933">
    <text xml:space="preserve" x="90" y="415">services:</text>
    <text xml:space="preserve" x="90" y="455">  <tspan fill="#C2255C" font-weight="bold">web:</tspan></text>
    <text xml:space="preserve" x="90" y="495">    image: <tspan fill="#2496ED" font-weight="bold">nginx:alpine</tspan></text>
    <text xml:space="preserve" x="90" y="535">    ports:</text>
    <text xml:space="preserve" x="90" y="575">      - <tspan fill="#0C8599" font-weight="bold">"8007:80"</tspan></text>
    <text xml:space="preserve" x="90" y="615">    volumes:</text>
    <text xml:space="preserve" x="90" y="655">      - <tspan fill="#B7791F" font-weight="bold">./sito:/usr/share/nginx/html:ro</tspan></text>
    <text xml:space="preserve" x="90" y="695">    <tspan fill="#2F9E44" font-weight="bold">restart: unless-stopped</tspan></text>
  </g>
  <text x="90" y="770" font-size="17" fill="#52606D">YAML: l'indentazione conta, si usano spazi e mai tab.</text>

  <!-- Spiegazioni -->
  <g font-size="19" fill="#3E4C59">
    <circle cx="880" cy="448" r="9" fill="#C2255C"/>
    <text x="900" y="455"><tspan font-weight="bold" fill="#1F2933">web</tspan> è il nome del servizio. Il container si</text>
    <text x="900" y="482">chiamerà web-web-1: cartella-servizio-numero.</text>
    <circle cx="880" cy="528" r="9" fill="#2496ED"/>
    <text x="900" y="535"><tspan font-weight="bold" fill="#1F2933">image</tspan>: quale progetto di negozio usare.</text>
    <circle cx="880" cy="588" r="9" fill="#0C8599"/>
    <text x="900" y="595"><tspan font-weight="bold" fill="#1F2933">ports</tspan>: come -p, ESTERNA:INTERNA.</text>
    <circle cx="880" cy="648" r="9" fill="#B7791F"/>
    <text x="900" y="655"><tspan font-weight="bold" fill="#1F2933">volumes</tspan>: come -v. I percorsi con ./</text>
    <text x="900" y="682">partono dalla cartella del file (~/web).</text>
    <circle cx="880" cy="728" r="9" fill="#2F9E44"/>
    <text x="900" y="735"><tspan font-weight="bold" fill="#1F2933">restart</tspan>: riparti da solo se ti fermi</text>
    <text x="900" y="762">o se il server si riavvia. Ci torneremo.</text>
  </g>
  <rect x="860" y="365" width="680" height="45" rx="8" fill="#E8F4FD"/>
  <text x="880" y="395" font-size="19" font-weight="bold" fill="#2496ED">Il file si legge, si versiona con git, si copia.</text>

  <text x="60" y="855" font-size="19" fill="#3E4C59">Un compose.yml può avere più servizi: Loki e Grafana stanno nello stesso file e si trovano per nome (http://loki:3100).</text>
</svg>

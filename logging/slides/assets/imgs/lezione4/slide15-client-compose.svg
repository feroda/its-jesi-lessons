<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Il client: Alloy sul tuo PC</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">logging/pc-studente/compose.yml</text>
<rect x="70" y="175" width="960" height="664" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="221" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">services:</text>
<text xml:space="preserve" x="102" y="260" font-size="23" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">  alloy:</text>
<text xml:space="preserve" x="102" y="299" font-size="23" fill="#2496ED" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    image: grafana/alloy:v1.20.1</text>
<text xml:space="preserve" x="102" y="338" font-size="23" fill="#C92A2A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    hostname: mario-rossi</text>
<text xml:space="preserve" x="102" y="377" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    command:</text>
<text xml:space="preserve" x="102" y="416" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - run</text>
<text xml:space="preserve" x="102" y="455" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - --server.http.listen-addr=0.0.0.0:12345</text>
<text xml:space="preserve" x="102" y="494" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - --storage.path=/var/lib/alloy/data</text>
<text xml:space="preserve" x="102" y="533" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - /etc/alloy/config.alloy</text>
<text xml:space="preserve" x="102" y="572" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    ports:</text>
<text xml:space="preserve" x="102" y="611" font-size="23" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - "127.0.0.1:12345:12345"</text>
<text xml:space="preserve" x="102" y="650" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    volumes:</text>
<text xml:space="preserve" x="102" y="689" font-size="23" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro</text>
<text xml:space="preserve" x="102" y="728" font-size="23" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - ..:/log-corso:ro</text>
<text xml:space="preserve" x="102" y="767" font-size="23" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - alloy-data:/var/lib/alloy/data</text>
<text xml:space="preserve" x="102" y="806" font-size="23" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    restart: unless-stopped</text>
<text xml:space="preserve" x="1060" y="338" font-size="30" fill="#C92A2A" font-weight="bold">← il TUO nome</text>
<text xml:space="preserve" x="1060" y="455" font-size="26" fill="#3E4C59" font-weight="bold">← avvia Alloy con</text>
<text xml:space="preserve" x="1090" y="494" font-size="26" fill="#3E4C59" font-weight="bold">il suo file di configurazione</text>
<text xml:space="preserve" x="1060" y="611" font-size="26" fill="#0C8599" font-weight="bold">← pagina di Alloy, solo dal PC</text>
<text xml:space="preserve" x="1060" y="689" font-size="26" fill="#B7791F" font-weight="bold">← la configurazione</text>
<text xml:space="preserve" x="1060" y="728" font-size="26" fill="#B7791F" font-weight="bold">← i .log della lezione 2</text>
<text xml:space="preserve" x="1060" y="767" font-size="26" fill="#B7791F" font-weight="bold">← dove è arrivato a leggere</text>
</svg>

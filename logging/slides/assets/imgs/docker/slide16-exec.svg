<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Entrare nel container</text>
<text x="70" y="152" font-size="27" fill="#52606D">docker exec avvia un comando dentro un container acceso</text>
<rect x="70" y="195" width="1460" height="319" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="100" y="247" font-size="28" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker exec -it web-07 sh</text>
<text xml:space="preserve" x="100" y="293" font-size="28" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">/ # ls /usr/share/nginx/html</text>
<text xml:space="preserve" x="100" y="339" font-size="28" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">index.html</text>
<text xml:space="preserve" x="100" y="386" font-size="28" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">/ # cat /etc/os-release</text>
<text xml:space="preserve" x="100" y="432" font-size="28" fill="#7BC47F" font-family="DejaVu Sans Mono, monospace">NAME="Alpine Linux"</text>
<text xml:space="preserve" x="100" y="478" font-size="28" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">/ # exit</text>
<text x="800" y="700" font-size="34" fill="#1F2933" font-weight="bold" text-anchor="middle">Dentro c'è un altro Linux, piccolo: Alpine.</text>
<text x="800" y="760" font-size="28" fill="#3E4C59" text-anchor="middle">Come fare ssh in un altro server, ma senza rete.</text>
</svg>

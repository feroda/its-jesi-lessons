<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="66" font-size="38" font-weight="bold" fill="#1F2933">Il sito non risponde: un livello alla volta</text>
<text x="60" y="104" font-size="21" fill="#52606D">Lo stesso metodo delle lezioni 1 e 2, con un gradino in più: il container</text>
<rect x="50" y="135" width="1500" height="172" rx="14" fill="#F0FCFD" stroke="#0C8599" stroke-width="3"/>
<rect x="72" y="151" width="237" height="30" rx="15" fill="#0C8599"/>
<text x="86" y="172" font-size="16" font-weight="bold" fill="#FFFFFF">DAL CLIENT · PORTA</text>
<text x="72" y="227" font-size="40" font-weight="bold" fill="#0C8599" font-family="DejaVu Sans Mono, monospace">nc</text>
<text x="72" y="270" font-size="19" font-weight="bold" fill="#1F2933">Il negozio è aperto?</text>
<rect x="430" y="151" width="620" height="140" rx="10" fill="#1F2933"/>
<text xml:space="preserve" x="450" y="187" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ nc -zv IP-del-VPS 8007</text>
<text xml:space="preserve" x="450" y="217" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">nc: connect to ... port 8007 (tcp)</text>
<text xml:space="preserve" x="450" y="247" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">    failed: Connection refused</text>
<text x="1075" y="190" font-size="17" fill="#3E4C59">refused: il server c'è, ma sulla</text>
<text x="1075" y="220" font-size="17" fill="#3E4C59">8007 non ascolta nessuno.</text>
<text x="1075" y="250" font-size="17" fill="#3E4C59">Si passa sul server.</text>
<rect x="50" y="319" width="1500" height="172" rx="14" fill="#F7F5FF" stroke="#6741D9" stroke-width="3"/>
<rect x="72" y="335" width="306" height="30" rx="15" fill="#6741D9"/>
<text x="86" y="356" font-size="16" font-weight="bold" fill="#FFFFFF">SUL SERVER · CHI ASCOLTA</text>
<text x="72" y="411" font-size="40" font-weight="bold" fill="#6741D9" font-family="DejaVu Sans Mono, monospace">ss</text>
<text x="72" y="454" font-size="19" font-weight="bold" fill="#1F2933">C'è qualcuno sulla porta?</text>
<rect x="430" y="335" width="620" height="140" rx="10" fill="#1F2933"/>
<text xml:space="preserve" x="450" y="371" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ sudo ss -ltnp | grep 8007</text>
<text xml:space="preserve" x="450" y="401" font-size="17" fill="#7BC47F" font-family="DejaVu Sans Mono, monospace"># nessuna riga: nessuno ascolta</text>
<text xml:space="preserve" x="450" y="431" font-size="17" fill="#7BC47F" font-family="DejaVu Sans Mono, monospace"># se gira: users:(("docker-proxy",...))</text>
<text x="1075" y="374" font-size="17" fill="#3E4C59">Con Docker sulla porta non vedi</text>
<text x="1075" y="404" font-size="17" fill="#3E4C59">nginx ma docker-proxy.</text>
<text x="1075" y="434" font-size="17" fill="#3E4C59">Nessuna riga: il container è giù?</text>
<rect x="50" y="503" width="1500" height="172" rx="14" fill="#E8F4FD" stroke="#2496ED" stroke-width="3"/>
<rect x="72" y="519" width="248" height="30" rx="15" fill="#2496ED"/>
<text x="86" y="540" font-size="16" font-weight="bold" fill="#FFFFFF">SUL SERVER · DOCKER</text>
<text x="72" y="595" font-size="34" font-weight="bold" fill="#2496ED" font-family="DejaVu Sans Mono, monospace">docker ps -a</text>
<text x="72" y="638" font-size="19" font-weight="bold" fill="#1F2933">Il container gira?</text>
<rect x="430" y="519" width="620" height="140" rx="10" fill="#1F2933"/>
<text xml:space="preserve" x="450" y="555" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker ps -a</text>
<text xml:space="preserve" x="450" y="585" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">NAMES    STATUS</text>
<text xml:space="preserve" x="450" y="615" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">web-07   Exited (0) 2 minutes ago</text>
<text x="1075" y="558" font-size="17" fill="#3E4C59">Senza -a vedi solo quelli accesi.</text>
<text x="1075" y="588" font-size="17" fill="#3E4C59">Exited: si è fermato. Da solo</text>
<text x="1075" y="618" font-size="17" fill="#3E4C59">o qualcuno l'ha fermato?</text>
<rect x="50" y="687" width="1500" height="172" rx="14" fill="#FFF5F9" stroke="#C2255C" stroke-width="3"/>
<rect x="72" y="703" width="214" height="30" rx="15" fill="#C2255C"/>
<text x="86" y="724" font-size="16" font-weight="bold" fill="#FFFFFF">SUL SERVER · LOG</text>
<text x="72" y="779" font-size="34" font-weight="bold" fill="#C2255C" font-family="DejaVu Sans Mono, monospace">docker logs</text>
<text x="72" y="822" font-size="19" font-weight="bold" fill="#1F2933">Cosa ha detto il container?</text>
<rect x="430" y="703" width="620" height="140" rx="10" fill="#1F2933"/>
<text xml:space="preserve" x="450" y="739" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker logs --tail 20 web-07</text>
<text xml:space="preserve" x="450" y="769" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">... signal 3 (SIGQUIT) received,</text>
<text xml:space="preserve" x="450" y="799" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">    shutting down</text>
<text x="1075" y="742" font-size="17" fill="#3E4C59">Qualcuno l'ha spento (docker stop).</text>
<text x="1075" y="772" font-size="17" fill="#3E4C59">Poi: docker start web-07</text>
<text x="1075" y="802" font-size="17" fill="#3E4C59">e si ricomincia dal primo livello.</text>
</svg>

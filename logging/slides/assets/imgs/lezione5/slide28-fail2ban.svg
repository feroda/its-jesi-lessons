<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">fail2ban: dal log all'azione</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Legge i log e banna chi sbaglia troppe volte</text>
<rect x="70" y="200" width="400" height="150" rx="12" fill="#E7F0FD" stroke="#1C64C8" stroke-width="3"/>
<text xml:space="preserve" x="270.0" y="269.4" font-size="32" fill="#1C64C8" font-weight="bold" text-anchor="middle">log di sshd</text>
<text xml:space="preserve" x="270.0" y="305.4" font-size="24" fill="#52606D" text-anchor="middle">auth.log o journal</text>
<line x1="475" y1="275" x2="560" y2="275" stroke="#1F2933" stroke-width="5" marker-end="url(#aK)"/>
<rect x="570" y="200" width="400" height="150" rx="12" fill="#FFF9DB" stroke="#B7791F" stroke-width="3"/>
<text xml:space="preserve" x="770.0" y="270.8" font-size="36" fill="#B7791F" font-weight="bold" text-anchor="middle">fail2ban</text>
<text xml:space="preserve" x="770.0" y="306.8" font-size="24" fill="#52606D" text-anchor="middle">5 errori in 10 minuti?</text>
<line x1="975" y1="275" x2="1060" y2="275" stroke="#1F2933" stroke-width="5" marker-end="url(#aK)"/>
<rect x="1070" y="200" width="460" height="150" rx="12" fill="#FFF5F5" stroke="#C92A2A" stroke-width="3"/>
<text xml:space="preserve" x="1300.0" y="270.8" font-size="36" fill="#C92A2A" font-weight="bold" text-anchor="middle">firewall</text>
<text xml:space="preserve" x="1300.0" y="306.8" font-size="24" fill="#52606D" text-anchor="middle">DROP dell'IP per 1 ora</text>
<rect x="70" y="450" width="640" height="318" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="506" font-size="26" fill="#1F2933" font-family="DejaVu Sans Mono, monospace"># /etc/fail2ban/jail.local</text>
<text xml:space="preserve" x="102" y="550" font-size="26" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">[sshd]</text>
<text xml:space="preserve" x="102" y="594" font-size="26" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">enabled  = true</text>
<text xml:space="preserve" x="102" y="638" font-size="26" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">maxretry = 5</text>
<text xml:space="preserve" x="102" y="682" font-size="26" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">findtime = 10m</text>
<text xml:space="preserve" x="102" y="726" font-size="26" fill="#C92A2A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">bantime  = 1h</text>
<rect x="760" y="450" width="770" height="180" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="792" y="505" font-size="24" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ sudo fail2ban-client status sshd</text>
<text xml:space="preserve" x="792" y="547" font-size="24" fill="#8CE99A" font-family="DejaVu Sans Mono, monospace">   |- Currently banned: 1</text>
<text xml:space="preserve" x="792" y="589" font-size="24" fill="#8CE99A" font-family="DejaVu Sans Mono, monospace">   `- Banned IP list: 45.9.14.207</text>
<text xml:space="preserve" x="760" y="700" font-size="26" fill="#1F2933">Nel nostro log il brute force parte con 8 errori di fila:</text>
<text xml:space="preserve" x="760" y="742" font-size="26" fill="#1F2933" font-weight="bold">sarebbe stato bannato prima dell'accesso riuscito.</text>
<text xml:space="preserve" x="70" y="840" font-size="26" fill="#52606D">Lezione 2: "fail2ban" era il nome finto del miner. Controllate sempre il percorso del programma.</text>
</svg>

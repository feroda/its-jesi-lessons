<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="72" font-size="40" font-weight="bold" fill="#1F2933">Registry, immagini, container</text>
  <text x="60" y="110" font-size="22" fill="#52606D">Le tre parole da sapere (ridisegnato da Microsoft Learn, "Docker overview")</text>

  <!-- Registry -->
  <rect x="70" y="170" width="300" height="320" rx="8" fill="#F3E6C8" stroke="#8D6E2F" stroke-width="4"/>
  <line x1="70" y1="250" x2="370" y2="250" stroke="#8D6E2F" stroke-width="4"/><line x1="70" y1="330" x2="370" y2="330" stroke="#8D6E2F" stroke-width="4"/><line x1="70" y1="410" x2="370" y2="410" stroke="#8D6E2F" stroke-width="4"/><rect x="85" y="183" width="130" height="54" rx="4" fill="#DCEFFD" stroke="#2496ED" stroke-width="2.5"/><line x1="181" y1="191" x2="181" y2="229" stroke="#2496ED" stroke-width="2"/><line x1="189" y1="191" x2="189" y2="229" stroke="#2496ED" stroke-width="2"/><line x1="197" y1="191" x2="197" y2="229" stroke="#2496ED" stroke-width="2"/><line x1="205" y1="191" x2="205" y2="229" stroke="#2496ED" stroke-width="2"/><text x="95" y="215.25" font-size="15" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">nginx</text><rect x="225" y="183" width="130" height="54" rx="4" fill="#DCEFFD" stroke="#2496ED" stroke-width="2.5"/><line x1="321" y1="191" x2="321" y2="229" stroke="#2496ED" stroke-width="2"/><line x1="329" y1="191" x2="329" y2="229" stroke="#2496ED" stroke-width="2"/><line x1="337" y1="191" x2="337" y2="229" stroke="#2496ED" stroke-width="2"/><line x1="345" y1="191" x2="345" y2="229" stroke="#2496ED" stroke-width="2"/><text x="235" y="215.25" font-size="15" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">grafana</text><rect x="85" y="263" width="130" height="54" rx="4" fill="#DCEFFD" stroke="#2496ED" stroke-width="2.5"/><line x1="181" y1="271" x2="181" y2="309" stroke="#2496ED" stroke-width="2"/><line x1="189" y1="271" x2="189" y2="309" stroke="#2496ED" stroke-width="2"/><line x1="197" y1="271" x2="197" y2="309" stroke="#2496ED" stroke-width="2"/><line x1="205" y1="271" x2="205" y2="309" stroke="#2496ED" stroke-width="2"/><text x="95" y="295.25" font-size="15" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">loki</text><rect x="225" y="263" width="130" height="54" rx="4" fill="#DCEFFD" stroke="#2496ED" stroke-width="2.5"/><line x1="321" y1="271" x2="321" y2="309" stroke="#2496ED" stroke-width="2"/><line x1="329" y1="271" x2="329" y2="309" stroke="#2496ED" stroke-width="2"/><line x1="337" y1="271" x2="337" y2="309" stroke="#2496ED" stroke-width="2"/><line x1="345" y1="271" x2="345" y2="309" stroke="#2496ED" stroke-width="2"/><text x="235" y="295.25" font-size="15" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">alloy</text><rect x="85" y="343" width="130" height="54" rx="4" fill="#DCEFFD" stroke="#2496ED" stroke-width="2.5"/><line x1="181" y1="351" x2="181" y2="389" stroke="#2496ED" stroke-width="2"/><line x1="189" y1="351" x2="189" y2="389" stroke="#2496ED" stroke-width="2"/><line x1="197" y1="351" x2="197" y2="389" stroke="#2496ED" stroke-width="2"/><line x1="205" y1="351" x2="205" y2="389" stroke="#2496ED" stroke-width="2"/><text x="95" y="375.25" font-size="15" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">hello</text><rect x="225" y="343" width="130" height="54" rx="4" fill="#DCEFFD" stroke="#2496ED" stroke-width="2.5"/><line x1="321" y1="351" x2="321" y2="389" stroke="#2496ED" stroke-width="2"/><line x1="329" y1="351" x2="329" y2="389" stroke="#2496ED" stroke-width="2"/><line x1="337" y1="351" x2="337" y2="389" stroke="#2496ED" stroke-width="2"/><line x1="345" y1="351" x2="345" y2="389" stroke="#2496ED" stroke-width="2"/><text x="235" y="375.25" font-size="15" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">postgres</text><rect x="85" y="423" width="130" height="54" rx="4" fill="#DCEFFD" stroke="#2496ED" stroke-width="2.5"/><line x1="181" y1="431" x2="181" y2="469" stroke="#2496ED" stroke-width="2"/><line x1="189" y1="431" x2="189" y2="469" stroke="#2496ED" stroke-width="2"/><line x1="197" y1="431" x2="197" y2="469" stroke="#2496ED" stroke-width="2"/><line x1="205" y1="431" x2="205" y2="469" stroke="#2496ED" stroke-width="2"/><text x="95" y="455.25" font-size="15" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">...</text>
  <text x="220" y="545" font-size="30" font-weight="bold" fill="#8D6E2F" text-anchor="middle">Registry</text>
  <text x="220" y="577" font-size="18" fill="#3E4C59" text-anchor="middle">il magazzino: conserva</text>
  <text x="220" y="601" font-size="18" fill="#3E4C59" text-anchor="middle">tante immagini con nome</text>
  <text x="220" y="625" font-size="18" fill="#3E4C59" text-anchor="middle">e versione</text>

  <!-- pull -->
  <path d="M378,330 L462,330" stroke="#1F2933" stroke-width="4" fill="none" marker-end="url(#arr)"/>
  <text x="420" y="312" font-size="17" font-weight="bold" fill="#1F2933" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">pull</text>

  <!-- Immagine -->
  <rect x="470" y="290" width="190" height="80" rx="4" fill="#DCEFFD" stroke="#2496ED" stroke-width="2.5"/><line x1="626" y1="298" x2="626" y2="362" stroke="#2496ED" stroke-width="2"/><line x1="634" y1="298" x2="634" y2="362" stroke="#2496ED" stroke-width="2"/><line x1="642" y1="298" x2="642" y2="362" stroke="#2496ED" stroke-width="2"/><line x1="650" y1="298" x2="650" y2="362" stroke="#2496ED" stroke-width="2"/><text x="480" y="335.95" font-size="17" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">nginx:alpine</text>
  <text x="565" y="545" font-size="30" font-weight="bold" fill="#2496ED" text-anchor="middle">Immagine</text>
  <text x="565" y="577" font-size="18" fill="#3E4C59" text-anchor="middle">un pacchetto fermo,</text>
  <text x="565" y="601" font-size="18" fill="#3E4C59" text-anchor="middle">in sola lettura: programma,</text>
  <text x="565" y="625" font-size="18" fill="#3E4C59" text-anchor="middle">librerie, configurazione</text>

  <!-- run -->
  <path d="M668,330 L752,330" stroke="#1F2933" stroke-width="4" fill="none" marker-end="url(#arr)"/>
  <text x="710" y="312" font-size="17" font-weight="bold" fill="#1F2933" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">run</text>

  <!-- Container sul server -->
  <rect x="760" y="200" width="250" height="270" rx="10" fill="#F5F7FA" stroke="#3E4C59" stroke-width="3"/>
  <text x="885" y="232" font-size="17" font-weight="bold" fill="#3E4C59" text-anchor="middle">server (host)</text>
  <rect x="790" y="250" width="190" height="54" rx="4" fill="#E3F6E8" stroke="#2F9E44" stroke-width="2.5"/><line x1="946" y1="258" x2="946" y2="296" stroke="#2F9E44" stroke-width="2"/><line x1="954" y1="258" x2="954" y2="296" stroke="#2F9E44" stroke-width="2"/><line x1="962" y1="258" x2="962" y2="296" stroke="#2F9E44" stroke-width="2"/><line x1="970" y1="258" x2="970" y2="296" stroke="#2F9E44" stroke-width="2"/><text x="800" y="282.6" font-size="16" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">web-07</text><circle cx="930" cy="277.0" r="8" fill="#2F9E44"/>
  <rect x="790" y="320" width="190" height="54" rx="4" fill="#E3F6E8" stroke="#2F9E44" stroke-width="2.5"/><line x1="946" y1="328" x2="946" y2="366" stroke="#2F9E44" stroke-width="2"/><line x1="954" y1="328" x2="954" y2="366" stroke="#2F9E44" stroke-width="2"/><line x1="962" y1="328" x2="962" y2="366" stroke="#2F9E44" stroke-width="2"/><line x1="970" y1="328" x2="970" y2="366" stroke="#2F9E44" stroke-width="2"/><text x="800" y="352.6" font-size="16" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">web-08</text><circle cx="930" cy="347.0" r="8" fill="#2F9E44"/>
  <rect x="790" y="390" width="190" height="54" rx="4" fill="#E3F6E8" stroke="#2F9E44" stroke-width="2.5"/><line x1="946" y1="398" x2="946" y2="436" stroke="#2F9E44" stroke-width="2"/><line x1="954" y1="398" x2="954" y2="436" stroke="#2F9E44" stroke-width="2"/><line x1="962" y1="398" x2="962" y2="436" stroke="#2F9E44" stroke-width="2"/><line x1="970" y1="398" x2="970" y2="436" stroke="#2F9E44" stroke-width="2"/><text x="800" y="422.6" font-size="16" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">web-12</text><circle cx="930" cy="417.0" r="8" fill="#2F9E44"/>
  <text x="885" y="545" font-size="30" font-weight="bold" fill="#2F9E44" text-anchor="middle">Container</text>
  <text x="885" y="577" font-size="18" fill="#3E4C59" text-anchor="middle">un'immagine in moto:</text>
  <text x="885" y="601" font-size="18" fill="#3E4C59" text-anchor="middle">un processo vivo, con</text>
  <text x="885" y="625" font-size="18" fill="#3E4C59" text-anchor="middle">le sue porte e i suoi log</text>

  <!-- Nota -->
  <rect x="70" y="680" width="940" height="160" rx="14" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="2"/>
  <text x="100" y="722" font-size="21" font-weight="bold" fill="#1F2933">Una sola immagine, tanti container</text>
  <text x="100" y="758" font-size="19" fill="#3E4C59">Come una classe e i suoi oggetti: da nginx:alpine ognuno di voi avvia il suo.</text>
  <text x="100" y="790" font-size="19" fill="#3E4C59">Se cancello un container l'immagine resta; se cancello l'immagine,</text>
  <text x="100" y="822" font-size="19" fill="#3E4C59">al prossimo run Docker la riscarica dal registry.</text>

  <!-- Colonna dei registry -->
  <rect x="1060" y="150" width="490" height="700" rx="14" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="2"/>
  <text x="1090" y="200" font-size="24" font-weight="bold" fill="#1F2933">Quali registry esistono</text>
  <text x="1090" y="250" font-size="20" font-weight="bold" fill="#2496ED">Pubblici, su Internet</text>
  <g font-size="19" fill="#3E4C59">
    <text x="1110" y="287">• Docker Hub: quello predefinito</text>
    <text x="1110" y="317">• GitHub (ghcr.io)</text>
    <text x="1110" y="347">• Quay (quay.io)</text>
    <text x="1110" y="377">• i registry di AWS, Google, Azure</text>
  </g>
  <text x="1090" y="440" font-size="20" font-weight="bold" fill="#8D6E2F">Privati, in azienda</text>
  <g font-size="19" fill="#3E4C59">
    <text x="1110" y="477">• GitLab, Harbor, Nexus</text>
    <text x="1110" y="507">• un registry installato in casa:</text>
    <text x="1128" y="537">anche lui è... un container</text>
  </g>
  <line x1="1090" y1="580" x2="1520" y2="580" stroke="#CBD2D9" stroke-width="2"/>
  <text x="1090" y="625" font-size="20" font-weight="bold" fill="#1F2933">Come si legge un nome</text>
  <text x="1090" y="672" font-size="22" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">grafana/loki:3.7.0</text>
  <g font-size="17" fill="#52606D">
    <text x="1090" y="705">grafana = chi la pubblica</text>
    <text x="1090" y="732">loki = il nome dell'immagine</text>
    <text x="1090" y="759">3.7.0 = la versione (il "tag")</text>
    <text x="1090" y="800" fill="#C2255C" font-weight="bold">Senza tag si prende :latest,</text>
    <text x="1090" y="825" fill="#C2255C" font-weight="bold">che cambia nel tempo.</text>
  </g>
</svg>

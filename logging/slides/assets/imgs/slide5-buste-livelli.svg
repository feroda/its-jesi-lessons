<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="66" font-size="38" font-weight="bold" fill="#1F2933">Non si parla al negozio: si spedisce un pacco</text>
<text x="60" y="104" font-size="21" fill="#52606D">Il browser chiede una pagina a Grafana. Il messaggio viaggia chiuso in due buste.</text>
<rect x="60" y="160" width="950" height="690" rx="10" fill="#F3F0FF" stroke="#6741D9" stroke-width="4"/>
<path d="M60,168 L535.0,220 L1010,168" fill="none" stroke="#6741D9" stroke-width="2.5" opacity="0.55"/>
<rect x="80" y="138" width="280.0" height="40" rx="8" fill="#6741D9"/>
<text x="98" y="166" font-size="20" font-weight="bold" fill="#FFFFFF">LIVELLO 3 · busta IP</text>
<text x="100" y="250" font-size="16" fill="#52606D">mittente</text>
<text x="100" y="280" font-size="24" font-weight="bold" fill="#6741D9" font-family="DejaVu Sans Mono, monospace">IP del tuo PC</text>
<text x="600" y="250" font-size="16" fill="#52606D">destinatario</text>
<text x="600" y="280" font-size="24" font-weight="bold" fill="#6741D9" font-family="DejaVu Sans Mono, monospace">128.140.61.87</text>
<rect x="110" y="350" width="850" height="470" rx="10" fill="#E3FAFC" stroke="#0C8599" stroke-width="4"/>
<path d="M110,358 L535.0,400 L960,358" fill="none" stroke="#0C8599" stroke-width="2.5" opacity="0.55"/>
<rect x="130" y="328" width="389.79999999999995" height="40" rx="8" fill="#0C8599"/>
<text x="148" y="356" font-size="20" font-weight="bold" fill="#FFFFFF">LIVELLO 4 · busta della porta</text>
<text x="150" y="432" font-size="16" fill="#52606D">porta mittente</text>
<text x="150" y="462" font-size="24" font-weight="bold" fill="#0C8599" font-family="DejaVu Sans Mono, monospace">50432</text>
<text x="600" y="432" font-size="16" fill="#52606D">porta destinatario</text>
<text x="600" y="462" font-size="24" font-weight="bold" fill="#0C8599" font-family="DejaVu Sans Mono, monospace">3000</text>
<text x="150" y="490" font-size="14" fill="#52606D">(scelta a caso dal PC)</text>
<path d="M160,530 L870,530 L910,570 L910,790 L160,790 Z" fill="#FFFFFF" stroke="#C2255C" stroke-width="4"/>
<path d="M870,530 L870,570 L910,570" fill="#FFF0F6" stroke="#C2255C" stroke-width="3"/>
<rect x="180" y="508" width="414.2" height="40" rx="8" fill="#C2255C"/>
<text x="198" y="536" font-size="20" font-weight="bold" fill="#FFFFFF">LIVELLO 7 · il messaggio (HTTP)</text>
<text x="200" y="592" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">GET /dashboards HTTP/1.1</text>
<text x="200" y="628" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">Host: befair3.befair.it:3000</text>
<text x="200" y="664" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">User-Agent: Firefox</text>
<text x="200" y="755" font-size="20" font-style="italic" fill="#C2255C">«Per favore, dammi la pagina delle dashboard»</text>
<text x="1070" y="186" font-size="24" font-weight="bold" fill="#1F2933">Chi legge cosa</text>
<rect x="1070" y="225" width="10" height="120" rx="4" fill="#6741D9"/>
<text x="1098" y="251" font-size="22" font-weight="bold" fill="#6741D9">Livello 3 · indirizzo IP</text>
<text x="1098" y="285" font-size="19" fill="#3E4C59">In quale centro commerciale</text>
<text x="1098" y="313" font-size="19" fill="#3E4C59">consegnare il pacco. Lo leggono</text>
<text x="1098" y="341" font-size="19" fill="#3E4C59">i router lungo Internet.</text>
<rect x="1070" y="415" width="10" height="120" rx="4" fill="#0C8599"/>
<text x="1098" y="441" font-size="22" font-weight="bold" fill="#0C8599">Livello 4 · porta</text>
<text x="1098" y="475" font-size="19" fill="#3E4C59">In quale negozio entrare.</text>
<text x="1098" y="503" font-size="19" fill="#3E4C59">Lo legge il server quando</text>
<text x="1098" y="531" font-size="19" fill="#3E4C59">il pacco è arrivato.</text>
<rect x="1070" y="605" width="10" height="120" rx="4" fill="#C2255C"/>
<text x="1098" y="631" font-size="22" font-weight="bold" fill="#C2255C">Livello 7 · messaggio</text>
<text x="1098" y="665" font-size="19" fill="#3E4C59">Cosa chiedi, nella lingua</text>
<text x="1098" y="693" font-size="19" fill="#3E4C59">del negozio: HTTP per Grafana.</text>
<text x="1098" y="721" font-size="19" fill="#3E4C59">Lo legge solo Grafana.</text>
<rect x="1070" y="790" width="470" height="100" rx="10" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="2"/>
<text x="1090" y="825" font-size="18" fill="#1F2933">Per Loki è uguale: cambiano la porta</text>
<text x="1090" y="851" font-size="18" fill="#1F2933">(3100) e il messaggio, che porta</text>
<text x="1090" y="877" font-size="18" fill="#1F2933">dentro i log da conservare.</text>
</svg>
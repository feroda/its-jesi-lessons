<text xml:space="preserve" x="102" y="280" font-size="30" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ snmpget -v2c -c public 192.168.1.1 1.3.6.1.2.1.1.3.0</text>
<text xml:space="preserve" x="800" y="420" font-size="56" fill="#6741D9" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1.3.6.1.2.1.1.3.0</text>
<text xml:space="preserve" x="800" y="490" font-size="32" fill="#1F2933" text-anchor="middle">= da quanto tempo è acceso (sysUpTime)</text>

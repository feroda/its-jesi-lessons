<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Docker: un servizio in una riga</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Immagine dal registry, container che gira, porte e log</text>
<rect x="70" y="200" width="1460" height="224" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="102" y="261" font-size="32" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ docker run -d --name grafana -p 3000:3000 grafana/grafana</text>
<text xml:space="preserve" x="102" y="321" font-size="32" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ docker ps</text>
<text xml:space="preserve" x="102" y="381" font-size="32" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ docker logs -f grafana 2&gt;&amp;1</text>
<circle cx="130" cy="522" r="26" fill="#2496ED"/><text xml:space="preserve" x="130" y="532" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">-d</text>
<text xml:space="preserve" x="185" y="534" font-size="32" fill="#1F2933" font-weight="bold">gira in background</text>
<circle cx="130" cy="632" r="26" fill="#0C8599"/><text xml:space="preserve" x="130" y="642" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">-p</text>
<text xml:space="preserve" x="185" y="644" font-size="32" fill="#1F2933" font-weight="bold">porta del PC : porta del container</text>
<circle cx="130" cy="742" r="26" fill="#B7791F"/><text xml:space="preserve" x="130" y="752" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2&gt;</text>
<text xml:space="preserve" x="185" y="754" font-size="32" fill="#1F2933" font-weight="bold">anche lo stderr, così grep vede gli errori</text>
</svg>

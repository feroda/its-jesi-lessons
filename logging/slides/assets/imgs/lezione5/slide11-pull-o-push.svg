<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Pull o push?</text>
<rect x="70" y="190" width="700" height="480" rx="14" fill="#FFFFFF" stroke="#C92A2A" stroke-width="3"/>
<rect x="830" y="190" width="700" height="480" rx="14" fill="#FFFFFF" stroke="#2F9E44" stroke-width="3"/>
<text xml:space="preserve" x="420" y="270" font-size="44" fill="#C92A2A" font-weight="bold" text-anchor="middle">Pull</text>
<text xml:space="preserve" x="110" y="360" font-size="28" fill="#1F2933">+ il server sa subito chi è giù</text>
<text xml:space="preserve" x="110" y="420" font-size="28" fill="#1F2933">+ si decide tutto sul server</text>
<text xml:space="preserve" x="110" y="510" font-size="28" fill="#3E4C59">- deve raggiungere ogni macchina</text>
<text xml:space="preserve" x="110" y="570" font-size="28" fill="#3E4C59">- niente IP privati</text>
<text xml:space="preserve" x="1180" y="270" font-size="44" fill="#2F9E44" font-weight="bold" text-anchor="middle">Push</text>
<text xml:space="preserve" x="870" y="360" font-size="28" fill="#1F2933">+ va bene dietro un router</text>
<text xml:space="preserve" x="870" y="420" font-size="28" fill="#1F2933">+ i PC non aprono porte: ascolta solo il server</text>
<text xml:space="preserve" x="870" y="510" font-size="28" fill="#3E4C59">- se l'agent tace, non sai perché</text>
<text xml:space="preserve" x="870" y="570" font-size="28" fill="#3E4C59">- ogni PC va configurato</text>
<text xml:space="preserve" x="70" y="770" font-size="32" fill="#1F2933" font-weight="bold">I vostri PC hanno IP privati: push. Come per i log in lezione 4.</text>
</svg>

<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Agent</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Un programma che gira sulla macchina da osservare</text>
<rect x="70" y="220" width="520" height="360" rx="18" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="330" y="280" font-size="30" fill="#3E4C59" font-weight="bold" text-anchor="middle">il tuo PC</text>
<rect x="150" y="340" width="360" height="110" rx="12" fill="#EBFBEE" stroke="#2F9E44" stroke-width="3"/>
<text xml:space="preserve" x="330.0" y="390.8" font-size="36" fill="#2F9E44" font-weight="bold" text-anchor="middle">Alloy</text>
<text xml:space="preserve" x="330.0" y="426.8" font-size="24" fill="#52606D" text-anchor="middle">l'agent</text>
<text xml:space="preserve" x="330" y="520" font-size="26" fill="#52606D" text-anchor="middle">CPU, RAM, disco, log</text>
<text xml:space="preserve" x="680" y="330" font-size="36" fill="#2F9E44" font-weight="bold">Vede tutto da dentro.</text>
<text xml:space="preserve" x="680" y="450" font-size="32" fill="#C92A2A" font-weight="bold">Ma va installato e aggiornato</text>
<text xml:space="preserve" x="680" y="500" font-size="32" fill="#C92A2A" font-weight="bold">su ogni macchina.</text>
<text xml:space="preserve" x="70" y="740" font-size="30" fill="#3E4C59">Alloy è il nostro agent: è lui a leggere i log e misurare il PC.</text>

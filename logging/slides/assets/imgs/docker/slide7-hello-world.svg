<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Il primo container</text>
<text x="70" y="152" font-size="27" fill="#52606D">L'output racconta da solo la slide di prima</text>
<rect x="70" y="195" width="1460" height="332" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="100" y="245" font-size="25" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker run hello-world</text>
<text xml:space="preserve" x="100" y="286" font-size="25" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">Hello from Docker!</text>
<text xml:space="preserve" x="100" y="327" font-size="25" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">...</text>
<text xml:space="preserve" x="100" y="368" font-size="25" fill="#7BC47F" font-family="DejaVu Sans Mono, monospace"> 1. The Docker client contacted the Docker daemon.</text>
<text xml:space="preserve" x="100" y="410" font-size="25" fill="#F0A060" font-family="DejaVu Sans Mono, monospace"> 2. The Docker daemon pulled the "hello-world" image from the Docker Hub.</text>
<text xml:space="preserve" x="100" y="451" font-size="25" fill="#7BC47F" font-family="DejaVu Sans Mono, monospace"> 3. The Docker daemon created a new container from that image ...</text>
<text xml:space="preserve" x="100" y="492" font-size="25" fill="#7BC47F" font-family="DejaVu Sans Mono, monospace"> 4. The Docker daemon streamed that output to the Docker client ...</text>
<circle cx="110" cy="640" r="24" fill="#2F9E44"/><text x="110" y="650" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="155" y="650" font-size="30" fill="#1F2933">il client chiede al demone</text>
<circle cx="830" cy="640" r="24" fill="#E8590C"/><text x="830" y="650" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text x="875" y="650" font-size="30" fill="#1F2933">il demone scarica l'immagine</text>
<circle cx="110" cy="725" r="24" fill="#2F9E44"/><text x="110" y="735" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="155" y="735" font-size="30" fill="#1F2933">crea e avvia il container</text>
<circle cx="830" cy="725" r="24" fill="#2F9E44"/><text x="830" y="735" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<text x="875" y="735" font-size="30" fill="#1F2933">l'output torna a te</text>
</svg>

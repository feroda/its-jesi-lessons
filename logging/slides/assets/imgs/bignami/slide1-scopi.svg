<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">A cosa serve ognuno</text>
<rect x="70" y="220" width="380" height="100" rx="10" fill="#1C64C8"/>
<text xml:space="preserve" x="260.0" y="282.24" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Logging</text>
<text xml:space="preserve" x="500" y="260" font-size="32" fill="#1F2933" font-weight="bold">registra gli eventi in modo immutabile:</text>
<text xml:space="preserve" x="500" y="308" font-size="30" fill="#3E4C59">si aggiunge in coda, non si riscrive il passato</text>
<rect x="70" y="410" width="380" height="100" rx="10" fill="#C92A2A"/>
<text xml:space="preserve" x="260.0" y="472.24" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Monitoring</text>
<text xml:space="preserve" x="500" y="450" font-size="32" fill="#1F2933" font-weight="bold">registra le metriche: numeri nel tempo</text>
<text xml:space="preserve" x="500" y="498" font-size="30" fill="#3E4C59">(CPU, memoria, disco, richieste al secondo)</text>
<rect x="70" y="600" width="380" height="100" rx="10" fill="#E8590C"/>
<text xml:space="preserve" x="260.0" y="662.24" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Troubleshooting</text>
<text xml:space="preserve" x="500" y="640" font-size="32" fill="#1F2933" font-weight="bold">cerca la causa radice (root cause) di un problema</text>
<text xml:space="preserve" x="500" y="688" font-size="30" fill="#3E4C59">usando i log e le metriche</text>
<text xml:space="preserve" x="70" y="835" font-size="27" fill="#52606D">I log sono davvero immutabili solo se escono dalla macchina: per questo si spediscono a Loki.</text>
</svg>

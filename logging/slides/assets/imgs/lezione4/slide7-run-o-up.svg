<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">docker run o docker compose up?</text>
<rect x="70" y="200" width="700" height="560" rx="14" fill="#FFFFFF" stroke="#2496ED" stroke-width="3"/>
<rect x="830" y="200" width="700" height="560" rx="14" fill="#FFFFFF" stroke="#2F9E44" stroke-width="3"/>
<text xml:space="preserve" x="420" y="290" font-size="44" fill="#2496ED" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">docker run</text>
<text xml:space="preserve" x="420" y="380" font-size="34" fill="#1F2933" font-weight="bold" text-anchor="middle">un container</text>
<text xml:space="preserve" x="420" y="470" font-size="30" fill="#3E4C59" text-anchor="middle">tutto scritto</text>
<text xml:space="preserve" x="420" y="515" font-size="30" fill="#3E4C59" text-anchor="middle">sulla riga di comando</text>
<text xml:space="preserve" x="420" y="620" font-size="30" fill="#3E4C59" text-anchor="middle">lo rilanci: un altro</text>
<text xml:space="preserve" x="420" y="665" font-size="30" fill="#3E4C59" text-anchor="middle">container (o un errore)</text>
<text xml:space="preserve" x="1180" y="290" font-size="44" fill="#2F9E44" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">docker compose up</text>
<text xml:space="preserve" x="1180" y="380" font-size="34" fill="#1F2933" font-weight="bold" text-anchor="middle">tutti i servizi del file</text>
<text xml:space="preserve" x="1180" y="470" font-size="30" fill="#3E4C59" text-anchor="middle">tutto scritto</text>
<text xml:space="preserve" x="1180" y="515" font-size="30" fill="#3E4C59" text-anchor="middle">in compose.yml</text>
<text xml:space="preserve" x="1180" y="620" font-size="30" fill="#3E4C59" text-anchor="middle">lo rilanci: cambia solo</text>
<text xml:space="preserve" x="1180" y="665" font-size="30" fill="#3E4C59" text-anchor="middle">quello che hai modificato</text>
</svg>

  <!-- Sottotitoli -->
  <text x="110" y="470" font-size="38" fill="#1F2933">ITS CyberSecurity - Jesi (AN) 2026/2027</text>
  <text x="110" y="530" font-size="30" fill="#52606D">Corso Logging, Monitoring, Troubleshooting</text>

  <!-- Docente -->

<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Docker Compose: più container insieme</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Si lancia nella cartella che contiene compose.yml</text>
<circle cx="110" cy="298" r="26" fill="#2F9E44"/><text xml:space="preserve" x="110" y="308" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text xml:space="preserve" x="165" y="310" font-size="38" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">docker compose up -d</text>
<text xml:space="preserve" x="165" y="365" font-size="30" fill="#3E4C59">crea e avvia tutti i servizi del file</text>
<circle cx="110" cy="478" r="26" fill="#2496ED"/><text xml:space="preserve" x="110" y="488" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text xml:space="preserve" x="165" y="490" font-size="38" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">docker compose down</text>
<text xml:space="preserve" x="165" y="545" font-size="30" fill="#3E4C59">ferma e cancella i container: i volumi con i dati restano</text>
<circle cx="110" cy="658" r="26" fill="#C92A2A"/><text xml:space="preserve" x="110" y="668" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text xml:space="preserve" x="165" y="670" font-size="38" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">docker compose down -v</text>
<text xml:space="preserve" x="165" y="725" font-size="30" fill="#C92A2A" font-weight="bold">cancella anche i volumi: i dati sono persi</text>
<text xml:space="preserve" x="70" y="840" font-size="28" fill="#52606D">Come con docker: docker compose ps e docker compose logs -f &lt;servizio&gt;.</text>
</svg>

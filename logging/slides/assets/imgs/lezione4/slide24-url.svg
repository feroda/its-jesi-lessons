<text xml:space="preserve" x="1387.6279999999997" y="356" font-size="24" fill="#2F9E44" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;anchor&gt;</text>
<text xml:space="preserve" x="115" y="280" font-size="28" font-family="DejaVu Sans Mono, monospace"><tspan fill="#C2255C" font-weight="bold">https</tspan><tspan fill="#1F2933" font-weight="bold">://</tspan><tspan fill="#6741D9" font-weight="bold">it.wikipedia.org</tspan><tspan fill="#1F2933" font-weight="bold">:</tspan><tspan fill="#0C8599" font-weight="bold">443</tspan><tspan fill="#1F2933" font-weight="bold">/</tspan><tspan fill="#1C64C8" font-weight="bold">wiki/Uniform_Resource_Locator</tspan><tspan fill="#1F2933" font-weight="bold">?</tspan><tspan fill="#B7791F" font-weight="bold">uselang=it</tspan><tspan fill="#1F2933" font-weight="bold">#</tspan><tspan fill="#2F9E44" font-weight="bold">cite_note-2</tspan></text>
<text xml:space="preserve" x="115" y="225" font-size="22" fill="#52606D">In giallo i separatori:  ://   :   /   ?   #</text>
<rect x="70" y="440" width="715" height="130" rx="12" fill="#FFFFFF" stroke="#C2255C" stroke-width="3"/>
<rect x="70" y="440" width="12" height="130" rx="6" fill="#C2255C"/>
<text xml:space="preserve" x="105" y="482" font-size="26" fill="#C2255C" font-weight="bold" font-family="DejaVu Sans Mono, monospace">&lt;proto&gt;</text>
<text xml:space="preserve" x="105" y="520" font-size="22" fill="#1F2933">il protocollo di livello 7: http o https</text>
<text xml:space="preserve" x="105" y="552" font-size="22" fill="#3E4C59">finisce con  ://</text>
<rect x="70" y="585" width="715" height="130" rx="12" fill="#FFFFFF" stroke="#6741D9" stroke-width="3"/>
<rect x="70" y="585" width="12" height="130" rx="6" fill="#6741D9"/>
<text xml:space="preserve" x="105" y="627" font-size="26" fill="#6741D9" font-weight="bold" font-family="DejaVu Sans Mono, monospace">&lt;fqdn&gt;</text>
<text xml:space="preserve" x="105" y="665" font-size="22" fill="#1F2933">il nome completo del server: il DNS</text>
<text xml:space="preserve" x="105" y="697" font-size="22" fill="#3E4C59">lo traduce nell'indirizzo IP (livello 3)</text>
<rect x="70" y="730" width="715" height="130" rx="12" fill="#FFFFFF" stroke="#0C8599" stroke-width="3"/>
<rect x="70" y="730" width="12" height="130" rx="6" fill="#0C8599"/>
<text xml:space="preserve" x="105" y="772" font-size="26" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">&lt;port&gt;</text>
<text xml:space="preserve" x="105" y="810" font-size="22" fill="#1F2933">la porta (livello 4), dopo i  :</text>
<text xml:space="preserve" x="105" y="842" font-size="22" fill="#3E4C59">si omette se è quella standard: 80 o 443</text>
<rect x="815" y="440" width="715" height="130" rx="12" fill="#FFFFFF" stroke="#1C64C8" stroke-width="3"/>
<rect x="815" y="440" width="12" height="130" rx="6" fill="#1C64C8"/>
<text xml:space="preserve" x="850" y="482" font-size="26" fill="#1C64C8" font-weight="bold" font-family="DejaVu Sans Mono, monospace">&lt;path&gt;</text>
<text xml:space="preserve" x="850" y="520" font-size="22" fill="#1F2933">la risorsa sul server, dopo la prima  /</text>
<text xml:space="preserve" x="850" y="552" font-size="22" fill="#3E4C59">è quello che finisce nei log del web server</text>
<rect x="815" y="585" width="715" height="130" rx="12" fill="#FFFFFF" stroke="#B7791F" stroke-width="3"/>
<rect x="815" y="585" width="12" height="130" rx="6" fill="#B7791F"/>
<text xml:space="preserve" x="850" y="627" font-size="26" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">&lt;querystring&gt;</text>
<text xml:space="preserve" x="850" y="665" font-size="22" fill="#1F2933">parametri per il server, dopo il  ?</text>
<text xml:space="preserve" x="850" y="697" font-size="22" fill="#3E4C59">nome=valore, più parametri uniti da  &amp;</text>
<rect x="815" y="730" width="715" height="130" rx="12" fill="#FFFFFF" stroke="#2F9E44" stroke-width="3"/>
<rect x="815" y="730" width="12" height="130" rx="6" fill="#2F9E44"/>
<text xml:space="preserve" x="850" y="772" font-size="26" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">&lt;anchor&gt;</text>
<text xml:space="preserve" x="850" y="810" font-size="22" fill="#1F2933">un punto della pagina, dopo il  #</text>
<text xml:space="preserve" x="850" y="842" font-size="22" fill="#3E4C59">resta nel browser: non arriva al server</text>
</svg>

<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">OID e MIB</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Ogni valore ha un indirizzo fatto di numeri</text>

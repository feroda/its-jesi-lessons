<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Il client: config.alloy</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">logging/pc-studente/alloy/config.alloy</text>
<rect x="70" y="175" width="1110" height="639" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="221" font-size="23" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">local.file_match "corso" {</text>
<text xml:space="preserve" x="102" y="261" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  path_targets = [{"__path__" = "/log-corso/*.log", job = "corso"}]</text>
<text xml:space="preserve" x="102" y="301" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">}</text>
<text xml:space="preserve" x="102" y="341" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace"></text>
<text xml:space="preserve" x="102" y="381" font-size="23" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">loki.source.file "corso" {</text>
<text xml:space="preserve" x="102" y="421" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  targets    = local.file_match.corso.targets</text>
<text xml:space="preserve" x="102" y="461" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  forward_to = [loki.write.vps.receiver]</text>
<text xml:space="preserve" x="102" y="501" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">}</text>
<text xml:space="preserve" x="102" y="541" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace"></text>
<text xml:space="preserve" x="102" y="581" font-size="23" fill="#1C64C8" font-weight="bold" font-family="DejaVu Sans Mono, monospace">loki.write "vps" {</text>
<text xml:space="preserve" x="102" y="621" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  endpoint {</text>
<text xml:space="preserve" x="102" y="661" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    url = "http://its.fabersoft.net:3100/loki/api/v1/push"</text>
<text xml:space="preserve" x="102" y="701" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  }</text>
<text xml:space="preserve" x="102" y="741" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  external_labels = { host = constants.hostname }</text>
<text xml:space="preserve" x="102" y="781" font-size="23" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">}</text>
<text xml:space="preserve" x="1220" y="261" font-size="34" fill="#2F9E44" font-weight="bold">1. trova i file</text>
<text xml:space="preserve" x="1220" y="421" font-size="34" fill="#0C8599" font-weight="bold">2. leggili</text>
<text xml:space="preserve" x="1220" y="621" font-size="34" fill="#1C64C8" font-weight="bold">3. spediscili</text>
<text xml:space="preserve" x="1220" y="666" font-size="28" fill="#3E4C59">a Loki, con</text>
<text xml:space="preserve" x="1220" y="711" font-size="28" fill="#3E4C59">l'etichetta host</text>

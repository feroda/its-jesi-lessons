<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Ripasso 2 · Troubleshooting dal client</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">A quale livello lavora ogni comando?</text>
<circle cx="110" cy="278" r="26" fill="#2496ED"/><text xml:space="preserve" x="110" y="288" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text xml:space="preserve" x="165" y="290" font-size="34" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">ping its.fabersoft.net</text>
<text xml:space="preserve" x="1530" y="290" font-size="28" fill="#3E4C59" text-anchor="end">livello ?</text>
<circle cx="110" cy="388" r="26" fill="#2496ED"/><text xml:space="preserve" x="110" y="398" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text xml:space="preserve" x="165" y="400" font-size="34" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">nc -zv its.fabersoft.net 3000</text>
<text xml:space="preserve" x="1530" y="400" font-size="28" fill="#3E4C59" text-anchor="end">livello ?</text>
<circle cx="110" cy="498" r="26" fill="#2496ED"/><text xml:space="preserve" x="110" y="508" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text xml:space="preserve" x="165" y="510" font-size="34" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">curl -I http://its.fabersoft.net:3000</text>
<text xml:space="preserve" x="1530" y="510" font-size="28" fill="#3E4C59" text-anchor="end">livello ?</text>
<rect x="70" y="610" width="1460" height="180" rx="14" fill="#FFFFFF"/>
<text xml:space="preserve" x="110" y="680" font-size="32" fill="#1F2933" font-weight="bold">Il ping non risponde ma nc sì: il servizio è raggiungibile?</text>
<text xml:space="preserve" x="110" y="735" font-size="28" fill="#3E4C59">(ricordate befair3 nella lezione 1)</text>
</svg>

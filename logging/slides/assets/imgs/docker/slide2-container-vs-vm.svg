<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="72" font-size="40" font-weight="bold" fill="#1F2933">Un container non è una macchina virtuale</text>
  <text x="60" y="110" font-size="22" fill="#52606D">Ricordi la lezione 2? Kernel, demoni, applicazioni. Il container condivide il kernel dell'host.</text>

  <!-- Macchine virtuali -->
  <text x="400" y="180" font-size="28" font-weight="bold" fill="#3E4C59" text-anchor="middle">Macchine virtuali</text>
  <g>
    <rect x="80" y="210" width="200" height="70" rx="8" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/>
    <text x="180" y="253" font-size="22" font-weight="bold" fill="#E8590C" text-anchor="middle">Grafana</text>
    <rect x="300" y="210" width="200" height="70" rx="8" fill="#E7F0FD" stroke="#1C64C8" stroke-width="3"/>
    <text x="400" y="253" font-size="22" font-weight="bold" fill="#1C64C8" text-anchor="middle">Loki</text>
    <rect x="520" y="210" width="200" height="70" rx="8" fill="#F5F7FA" stroke="#3E4C59" stroke-width="3"/>
    <text x="620" y="253" font-size="22" font-weight="bold" fill="#3E4C59" text-anchor="middle">nginx</text>

    <rect x="80" y="290" width="200" height="60" rx="8" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="2"/>
    <text x="180" y="327" font-size="18" fill="#52606D" text-anchor="middle">librerie</text>
    <rect x="300" y="290" width="200" height="60" rx="8" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="2"/>
    <text x="400" y="327" font-size="18" fill="#52606D" text-anchor="middle">librerie</text>
    <rect x="520" y="290" width="200" height="60" rx="8" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="2"/>
    <text x="620" y="327" font-size="18" fill="#52606D" text-anchor="middle">librerie</text>

    <rect x="80" y="360" width="200" height="80" rx="8" fill="#FCE8EC" stroke="#C2255C" stroke-width="3"/>
    <text x="180" y="395" font-size="19" font-weight="bold" fill="#C2255C" text-anchor="middle">sistema</text>
    <text x="180" y="420" font-size="19" font-weight="bold" fill="#C2255C" text-anchor="middle">+ kernel</text>
    <rect x="300" y="360" width="200" height="80" rx="8" fill="#FCE8EC" stroke="#C2255C" stroke-width="3"/>
    <text x="400" y="395" font-size="19" font-weight="bold" fill="#C2255C" text-anchor="middle">sistema</text>
    <text x="400" y="420" font-size="19" font-weight="bold" fill="#C2255C" text-anchor="middle">+ kernel</text>
    <rect x="520" y="360" width="200" height="80" rx="8" fill="#FCE8EC" stroke="#C2255C" stroke-width="3"/>
    <text x="620" y="395" font-size="19" font-weight="bold" fill="#C2255C" text-anchor="middle">sistema</text>
    <text x="620" y="420" font-size="19" font-weight="bold" fill="#C2255C" text-anchor="middle">+ kernel</text>

    <rect x="80" y="455" width="640" height="65" rx="8" fill="#EEF2F7" stroke="#52606D" stroke-width="3"/>
    <text x="400" y="496" font-size="22" font-weight="bold" fill="#3E4C59" text-anchor="middle">hypervisor</text>
    <rect x="80" y="530" width="640" height="65" rx="8" fill="#D9E2EC" stroke="#1F2933" stroke-width="3"/>
    <text x="400" y="571" font-size="22" font-weight="bold" fill="#1F2933" text-anchor="middle">hardware del server</text>
  </g>

  <!-- Container -->
  <text x="1200" y="180" font-size="28" font-weight="bold" fill="#2496ED" text-anchor="middle">Container</text>
  <g>
    <rect x="880" y="210" width="200" height="70" rx="8" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/>
    <text x="980" y="253" font-size="22" font-weight="bold" fill="#E8590C" text-anchor="middle">Grafana</text>
    <rect x="1100" y="210" width="200" height="70" rx="8" fill="#E7F0FD" stroke="#1C64C8" stroke-width="3"/>
    <text x="1200" y="253" font-size="22" font-weight="bold" fill="#1C64C8" text-anchor="middle">Loki</text>
    <rect x="1320" y="210" width="200" height="70" rx="8" fill="#F5F7FA" stroke="#3E4C59" stroke-width="3"/>
    <text x="1420" y="253" font-size="22" font-weight="bold" fill="#3E4C59" text-anchor="middle">nginx</text>

    <rect x="880" y="290" width="200" height="60" rx="8" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="2"/>
    <text x="980" y="327" font-size="18" fill="#52606D" text-anchor="middle">librerie</text>
    <rect x="1100" y="290" width="200" height="60" rx="8" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="2"/>
    <text x="1200" y="327" font-size="18" fill="#52606D" text-anchor="middle">librerie</text>
    <rect x="1320" y="290" width="200" height="60" rx="8" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="2"/>
    <text x="1420" y="327" font-size="18" fill="#52606D" text-anchor="middle">librerie</text>

    <!-- confini container -->
    <rect x="870" y="200" width="220" height="160" rx="12" fill="none" stroke="#2496ED" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="1090" y="200" width="220" height="160" rx="12" fill="none" stroke="#2496ED" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="1310" y="200" width="220" height="160" rx="12" fill="none" stroke="#2496ED" stroke-width="3" stroke-dasharray="10 6"/>

    <rect x="880" y="380" width="640" height="65" rx="8" fill="#DCEFFD" stroke="#2496ED" stroke-width="3"/>
    <text x="1200" y="420" font-size="22" font-weight="bold" fill="#2496ED" text-anchor="middle">Docker (demone dockerd)</text>
    <rect x="880" y="455" width="640" height="65" rx="8" fill="#FCE8EC" stroke="#C2255C" stroke-width="3"/>
    <text x="1200" y="496" font-size="22" font-weight="bold" fill="#C2255C" text-anchor="middle">sistema operativo + UN SOLO kernel</text>
    <rect x="880" y="530" width="640" height="65" rx="8" fill="#D9E2EC" stroke="#1F2933" stroke-width="3"/>
    <text x="1200" y="571" font-size="22" font-weight="bold" fill="#1F2933" text-anchor="middle">hardware del server</text>
  </g>

  <!-- Conseguenze -->
  <rect x="60" y="640" width="1480" height="215" rx="14" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="2"/>
  <text x="90" y="685" font-size="22" font-weight="bold" fill="#1F2933">Cosa cambia in pratica</text>
  <g font-size="20" fill="#3E4C59">
    <text x="90" y="725">• Un container parte in un secondo: non deve avviare un sistema operativo.</text>
    <text x="90" y="760">• Ognuno porta con sé le sue librerie: "sul mio PC funziona" vale anche sul server.</text>
    <text x="90" y="795">• Un container Linux ha bisogno di un kernel Linux: su Windows e Mac Docker Desktop usa una VM nascosta.</text>
    <text x="90" y="830">• Un processo nel container è un processo dell'host: lo vedi con ps aux, come il miner della lezione 2.</text>
  </g>
</svg>

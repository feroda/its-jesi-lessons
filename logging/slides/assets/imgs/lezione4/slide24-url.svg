<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Uniform Resource Locator (URL)</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Fonte: it.wikipedia.org/wiki/Uniform_Resource_Locator</text>

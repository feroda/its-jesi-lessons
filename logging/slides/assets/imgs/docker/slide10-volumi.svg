<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="72" font-size="40" font-weight="bold" fill="#1F2933">Volumi: i dati stanno fuori dal container</text>
  <text x="60" y="110" font-size="22" fill="#52606D">Il container si butta e si ricrea. Quello che deve restare (pagine, configurazioni, dati) va montato da fuori.</text>

  <!-- Bind mount -->
  <rect x="60" y="145" width="900" height="390" rx="14" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="2"/>
  <text x="85" y="185" font-size="22" font-weight="bold" fill="#1F2933">Una cartella dell'host dentro il container</text>
  <!-- host -->
  <rect x="85" y="210" width="360" height="250" rx="10" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
  <text x="265" y="242" font-size="18" font-weight="bold" fill="#3E4C59" text-anchor="middle">host (il VPS)</text>
  <rect x="110" y="265" width="310" height="100" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="3"/>
  <text x="125" y="298" font-size="18" font-weight="bold" fill="#B7791F" font-family="DejaVu Sans Mono, monospace">~/web/sito/</text>
  <text x="140" y="330" font-size="16" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">index.html</text>
  <text x="140" y="354" font-size="14" fill="#52606D">&lt;h1&gt;Ciao da 07&lt;/h1&gt;</text>
  <text x="110" y="405" font-size="16" fill="#3E4C59">La modifichi con nano</text>
  <text x="110" y="430" font-size="16" fill="#3E4C59">e il sito cambia subito.</text>
  <!-- container -->
  <rect x="580" y="210" width="355" height="250" rx="10" fill="#E3F6E8" stroke="#2F9E44" stroke-width="3" stroke-dasharray="12 7"/>
  <text x="757" y="242" font-size="18" font-weight="bold" fill="#2F9E44" text-anchor="middle">container web-07</text>
  <rect x="600" y="265" width="315" height="100" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="3"/>
  <text x="612" y="298" font-size="15" font-weight="bold" fill="#B7791F" font-family="DejaVu Sans Mono, monospace">/usr/share/nginx/html/</text>
  <text x="630" y="330" font-size="16" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">index.html</text>
  <text x="630" y="354" font-size="14" fill="#52606D">lo stesso file, non una copia</text>
  <text x="600" y="405" font-size="16" fill="#3E4C59">:ro = sola lettura. nginx</text>
  <text x="600" y="430" font-size="16" fill="#3E4C59">legge, ma non può modificare.</text>
  <path d="M424,315 L596,315" stroke="#B7791F" stroke-width="5" fill="none" marker-end="url(#aA)"/>
  <text x="510" y="300" font-size="15" font-weight="bold" fill="#B7791F" text-anchor="middle">-v</text>
  <text x="85" y="505" font-size="19" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">-v ~/web/sito:/usr/share/nginx/html:ro</text>
  <text x="560" y="505" font-size="16" fill="#52606D">HOST : CONTAINER : opzioni</text>

  <!-- Volumi con nome -->
  <rect x="990" y="145" width="550" height="390" rx="14" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="2"/>
  <text x="1015" y="185" font-size="22" font-weight="bold" fill="#1F2933">Lo vedrete nei nostri compose</text>
  <g font-size="17" fill="#3E4C59">
    <text x="1015" y="225" font-weight="bold" fill="#1C64C8">Loki (server)</text>
    <text x="1015" y="253" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1F2933">./loki/config.yml:/etc/loki/config.yml:ro</text>
    <text x="1015" y="278">la configurazione, scritta da noi</text>
    <text x="1015" y="306" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1F2933">loki-data:/loki</text>
    <text x="1015" y="331">un volume con nome: i log ricevuti</text>
    <text x="1015" y="356">sopravvivono se il container muore</text>
    <text x="1015" y="400" font-weight="bold" fill="#2496ED">Alloy (client, lezione 4)</text>
    <text x="1015" y="428" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1F2933">/var/log/journal:/var/log/journal:ro</text>
    <text x="1015" y="453">Alloy legge il journal dell'host</text>
    <text x="1015" y="478">(lezione 2) senza poterlo toccare</text>
  </g>

  <!-- Terminale -->
  <rect x="60" y="565" width="1480" height="295" rx="12" fill="#1F2933"/>
  <g font-size="17" font-family="DejaVu Sans Mono, monospace">
    <text xml:space="preserve" x="85" y="602" fill="#FFFFFF">$ mkdir -p ~/web/sito &amp;&amp; echo "&lt;h1&gt;Ciao da 07&lt;/h1&gt;" &gt; ~/web/sito/index.html</text>
    <text xml:space="preserve" x="85" y="632" fill="#FFFFFF">$ docker rm -f web-07</text>
    <text xml:space="preserve" x="85" y="662" fill="#FFFFFF">$ docker run -d --name web-07 -p 8007:80 -v ~/web/sito:/usr/share/nginx/html:ro nginx:alpine</text>
    <text xml:space="preserve" x="85" y="704" fill="#7BC47F"># e ora entriamo nel container, come con ssh in un altro server</text>
    <text xml:space="preserve" x="85" y="734" fill="#FFFFFF">$ docker exec -it web-07 sh</text>
    <text xml:space="preserve" x="85" y="764" fill="#9FB3C8">/ # ls /usr/share/nginx/html</text>
    <text xml:space="preserve" x="85" y="794" fill="#9FB3C8">index.html</text>
    <text xml:space="preserve" x="85" y="824" fill="#9FB3C8">/ # cat /etc/os-release     # Alpine Linux, non la distribuzione dell'host</text>
    <text xml:space="preserve" x="85" y="850" fill="#9FB3C8">/ # exit</text>
  </g>
</svg>

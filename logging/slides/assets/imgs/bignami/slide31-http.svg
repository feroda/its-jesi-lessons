<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">HTTP/1.1: richiesta e risposta</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">La pagina di Wikipedia sull'URL, e le risposte da riconoscere</text>
<text xml:space="preserve" x="70" y="210" font-size="24" fill="#C2255C" font-weight="bold">richiesta (dal client)</text>
<text xml:space="preserve" x="820" y="210" font-size="24" fill="#2F9E44" font-weight="bold">risposta (dal server)</text>
<rect x="70" y="225" width="700" height="195" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="264" font-size="19" fill="#C2255C" font-weight="bold" font-family="DejaVu Sans Mono, monospace">GET /wiki/Uniform_Resource_Locator?uselang=it HTTP/1.1</text>
<text xml:space="preserve" x="102" y="296" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">Host: it.wikipedia.org</text>
<text xml:space="preserve" x="102" y="328" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">User-Agent: curl/8.5.0</text>
<text xml:space="preserve" x="102" y="360" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">Accept: */*</text>
<text xml:space="preserve" x="102" y="392" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace"></text>
<rect x="820" y="225" width="710" height="291" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="852" y="264" font-size="19" fill="#8CE99A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">HTTP/1.1 200 OK</text>
<text xml:space="preserve" x="852" y="296" font-size="19" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">Date: Wed, 28 Oct 2026 10:15:02 GMT</text>
<text xml:space="preserve" x="852" y="328" font-size="19" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">Content-Type: text/html; charset=UTF-8</text>
<text xml:space="preserve" x="852" y="360" font-size="19" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">Content-Language: it</text>
<text xml:space="preserve" x="852" y="392" font-size="19" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace"></text>
<text xml:space="preserve" x="852" y="424" font-size="19" fill="#9AA5B1" font-family="DejaVu Sans Mono, monospace">&lt;!DOCTYPE html&gt;</text>
<text xml:space="preserve" x="852" y="456" font-size="19" fill="#9AA5B1" font-family="DejaVu Sans Mono, monospace">&lt;html class="client-nojs" lang="it" dir="ltr"&gt;</text>
<text xml:space="preserve" x="852" y="488" font-size="19" fill="#9AA5B1" font-family="DejaVu Sans Mono, monospace">... (il resto della pagina)</text>
<line x1="775" y1="300" x2="812" y2="300" stroke="#1F2933" stroke-width="4" marker-end="url(#aK)"/>
<text xml:space="preserve" x="70" y="456" font-size="22" fill="#3E4C59">La riga vuota chiude la richiesta.</text>
<text xml:space="preserve" x="70" y="490" font-size="22" fill="#3E4C59" font-weight="bold">#cite_note-2 non c'è: l'anchor resta nel browser.</text>
<text xml:space="preserve" x="1505" y="392" font-size="18" fill="#9AA5B1" text-anchor="end">riga vuota: poi arriva il body</text>
<text xml:space="preserve" x="745" y="392" font-size="18" fill="#52606D" text-anchor="end">riga vuota</text>
<text xml:space="preserve" x="70" y="585" font-size="28" fill="#B7791F" font-weight="bold">302 Found: vai altrove</text>
<rect x="70" y="600" width="715" height="132" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="102" y="638" font-size="20" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ curl -I http://its.fabersoft.net:3000</text>
<text xml:space="preserve" x="102" y="672" font-size="20" fill="#FFD43B" font-weight="bold" font-family="DejaVu Sans Mono, monospace">HTTP/1.1 302 Found</text>
<text xml:space="preserve" x="102" y="706" font-size="20" fill="#FFD43B" font-family="DejaVu Sans Mono, monospace">Location: /login</text>
<text xml:space="preserve" x="70" y="760" font-size="22" fill="#3E4C59">Grafana risponde e rimanda alla pagina di login.</text>
<text xml:space="preserve" x="815" y="585" font-size="28" fill="#C92A2A" font-weight="bold">404 Not Found: non esiste</text>
<rect x="815" y="600" width="715" height="132" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="847" y="638" font-size="20" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">GET /wiki/Pagina_che_non_esiste HTTP/1.1</text>
<text xml:space="preserve" x="847" y="672" font-size="20" fill="#FF8787" font-weight="bold" font-family="DejaVu Sans Mono, monospace">HTTP/1.1 404 Not Found</text>
<text xml:space="preserve" x="847" y="706" font-size="20" fill="#FF8787" font-family="DejaVu Sans Mono, monospace">Content-Type: text/html; charset=UTF-8</text>
<text xml:space="preserve" x="815" y="760" font-size="22" fill="#3E4C59">Il server risponde, ma quel path non c'è.</text>
<text xml:space="preserve" x="70" y="850" font-size="22" fill="#1F2933" font-weight="bold">Qualsiasi codice vuol dire che il livello 7 risponde: 2xx ok, 3xx altrove, 4xx errore del client, 5xx del server.</text>
</svg>

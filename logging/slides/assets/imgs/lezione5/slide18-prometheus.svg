<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Prometheus</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Un database a serie temporali (TSDB) che si interroga con PromQL</text>
<rect x="70" y="200" width="380" height="110" rx="12" fill="#EBFBEE" stroke="#2F9E44" stroke-width="3"/>
<text xml:space="preserve" x="260.0" y="250.1" font-size="30" fill="#2F9E44" font-weight="bold" text-anchor="middle">node exporter</text>
<text xml:space="preserve" x="260.0" y="283.1" font-size="22" fill="#52606D" text-anchor="middle">:9100  metriche della macchina</text>
<rect x="70" y="340" width="380" height="110" rx="12" fill="#E3FAFC" stroke="#0C8599" stroke-width="3"/>
<text xml:space="preserve" x="260.0" y="390.1" font-size="30" fill="#0C8599" font-weight="bold" text-anchor="middle">postgres exporter</text>
<text xml:space="preserve" x="260.0" y="423.1" font-size="22" fill="#52606D" text-anchor="middle">:9187  metriche del database</text>
<rect x="70" y="480" width="380" height="90" rx="12" fill="#EBFBEE" stroke="#2F9E44" stroke-width="3"/>
<text xml:space="preserve" x="260.0" y="520.1" font-size="30" fill="#2F9E44" font-weight="bold" text-anchor="middle">Alloy</text>
<text xml:space="preserve" x="260.0" y="553.1" font-size="22" fill="#52606D" text-anchor="middle">node exporter incluso</text>
<line x1="455" y1="255" x2="640" y2="330" stroke="#C92A2A" stroke-width="4" marker-end="url(#aR)"/>
<line x1="455" y1="395" x2="640" y2="375" stroke="#C92A2A" stroke-width="4" marker-end="url(#aR)"/>
<text xml:space="preserve" x="500" y="250" font-size="24" fill="#C92A2A" font-weight="bold">pull</text>
<line x1="455" y1="525" x2="640" y2="420" stroke="#2F9E44" stroke-width="4" marker-end="url(#aG)" stroke-dasharray="10 7"/>
<text xml:space="preserve" x="545" y="530" font-size="24" fill="#2F9E44" font-weight="bold">push</text>
<rect x="650" y="280" width="420" height="180" rx="12" fill="#FFF5F5" stroke="#C92A2A" stroke-width="3"/>
<text xml:space="preserve" x="860.0" y="366.5" font-size="38" fill="#C92A2A" font-weight="bold" text-anchor="middle">Prometheus</text>
<text xml:space="preserve" x="860.0" y="402.5" font-size="24" fill="#52606D" text-anchor="middle">TSDB, retention 15 giorni</text>
<line x1="1075" y1="370" x2="1150" y2="370" stroke="#52606D" stroke-width="3" marker-end="url(#aY)" stroke-dasharray="7 6"/>
<rect x="1160" y="300" width="370" height="140" rx="12" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/>
<text xml:space="preserve" x="1345.0" y="365.8" font-size="36" fill="#E8590C" font-weight="bold" text-anchor="middle">Grafana</text>
<text xml:space="preserve" x="1345.0" y="401.8" font-size="24" fill="#52606D" text-anchor="middle">grafici con PromQL</text>
<rect x="70" y="610" width="1460" height="150" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="102" y="651" font-size="22" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">up</text>
<text xml:space="preserve" x="102" y="691" font-size="22" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">node_load1</text>
<text xml:space="preserve" x="102" y="731" font-size="22" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">100 - avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100</text>
<text xml:space="preserve" x="1500" y="651" font-size="24" fill="#9AA5B1" text-anchor="end">1 se il target risponde</text>
<text xml:space="preserve" x="1500" y="691" font-size="24" fill="#9AA5B1" text-anchor="end">carico medio dell'ultimo minuto</text>
<text xml:space="preserve" x="1500" y="731" font-size="24" fill="#9AA5B1" text-anchor="end">CPU usata in %, per host</text>
</svg>

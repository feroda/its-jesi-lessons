<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Il primo pannello in Grafana</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Dashboards → New → sorgente dati Prometheus</text>
<rect x="70" y="220" width="1460" height="155" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="281" font-size="32" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">100 * (1 - avg by (host) (</text>
<text xml:space="preserve" x="102" y="332" font-size="32" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  rate(node_cpu_seconds_total{mode="idle"}[1m])))</text>
<text xml:space="preserve" x="110" y="470" font-size="32" fill="#1F2933" font-weight="bold">= la percentuale di CPU usata, una linea per ogni studente</text>
<text xml:space="preserve" x="70" y="640" font-size="30" fill="#3E4C59">idle = il tempo in cui la CPU non fa niente.</text>
<text xml:space="preserve" x="70" y="700" font-size="30" fill="#3E4C59">100 meno il tempo libero = il tempo occupato.</text>

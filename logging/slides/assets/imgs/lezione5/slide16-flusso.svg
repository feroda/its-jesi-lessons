<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Dalla sorgente al grafico</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Lo stesso flusso, per i log e per le metriche</text>
<rect x="70" y="180" width="335" height="110" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="237" y="228" font-size="30" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Raccolta</text>
<text xml:space="preserve" x="237" y="266" font-size="22" fill="#CBD2D9" text-anchor="middle">collection</text>
<text xml:space="preserve" x="90" y="340" font-size="23" fill="#3E4C59">prende i dati</text>
<text xml:space="preserve" x="90" y="372" font-size="23" fill="#3E4C59">dove nascono</text>
<line x1="410" y1="235" x2="438" y2="235" stroke="#1F2933" stroke-width="5" marker-end="url(#aK)"/>
<rect x="70" y="430" width="335" height="140" rx="12" fill="#E7F0FD" stroke="#1C64C8" stroke-width="3"/>
<text xml:space="preserve" x="90" y="490" font-size="25" fill="#1F2933" font-weight="bold">rsyslog, Alloy,</text>
<text xml:space="preserve" x="90" y="528" font-size="25" fill="#1F2933" font-weight="bold">Beats</text>
<rect x="70" y="630" width="335" height="140" rx="12" fill="#FFF5F5" stroke="#C92A2A" stroke-width="3"/>
<text xml:space="preserve" x="90" y="690" font-size="25" fill="#1F2933" font-weight="bold">exporter, Telegraf,</text>
<text xml:space="preserve" x="90" y="728" font-size="25" fill="#1F2933" font-weight="bold">agent Zabbix, SNMP</text>
<rect x="445" y="180" width="335" height="110" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="612" y="228" font-size="30" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Parsing</text>
<text xml:space="preserve" x="612" y="266" font-size="22" fill="#CBD2D9" text-anchor="middle">e normalizzazione</text>
<text xml:space="preserve" x="465" y="340" font-size="23" fill="#3E4C59">stesso formato e nomi:</text>
<text xml:space="preserve" x="465" y="372" font-size="23" fill="#3E4C59">etichette, unità, orari</text>
<line x1="785" y1="235" x2="813" y2="235" stroke="#1F2933" stroke-width="5" marker-end="url(#aK)"/>
<rect x="445" y="430" width="335" height="140" rx="12" fill="#E7F0FD" stroke="#1C64C8" stroke-width="3"/>
<text xml:space="preserve" x="465" y="490" font-size="25" fill="#1F2933" font-weight="bold">Logstash,</text>
<text xml:space="preserve" x="465" y="528" font-size="25" fill="#1F2933" font-weight="bold">gli stage di Alloy</text>
<rect x="445" y="630" width="335" height="140" rx="12" fill="#FFF5F5" stroke="#C92A2A" stroke-width="3"/>
<text xml:space="preserve" x="465" y="690" font-size="25" fill="#1F2933" font-weight="bold">etichette host e job,</text>
<text xml:space="preserve" x="465" y="728" font-size="25" fill="#1F2933" font-weight="bold">unità di misura</text>
<rect x="820" y="180" width="335" height="110" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="987" y="228" font-size="30" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Storage</text>
<text xml:space="preserve" x="987" y="266" font-size="22" fill="#CBD2D9" text-anchor="middle">con una retention</text>
<text xml:space="preserve" x="840" y="340" font-size="23" fill="#3E4C59">conserva i dati</text>
<text xml:space="preserve" x="840" y="372" font-size="23" fill="#3E4C59">per un tempo deciso</text>
<line x1="1160" y1="235" x2="1188" y2="235" stroke="#1F2933" stroke-width="5" marker-end="url(#aK)"/>
<rect x="820" y="430" width="335" height="140" rx="12" fill="#E7F0FD" stroke="#1C64C8" stroke-width="3"/>
<text xml:space="preserve" x="840" y="490" font-size="25" fill="#1F2933" font-weight="bold">Loki,</text>
<text xml:space="preserve" x="840" y="528" font-size="25" fill="#1F2933" font-weight="bold">Elasticsearch</text>
<rect x="820" y="630" width="335" height="140" rx="12" fill="#FFF5F5" stroke="#C92A2A" stroke-width="3"/>
<text xml:space="preserve" x="840" y="690" font-size="25" fill="#1F2933" font-weight="bold">Prometheus,</text>
<text xml:space="preserve" x="840" y="728" font-size="25" fill="#1F2933" font-weight="bold">InfluxDB</text>
<rect x="1195" y="180" width="335" height="110" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="1362" y="228" font-size="30" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Visualizzazione</text>
<text xml:space="preserve" x="1362" y="266" font-size="22" fill="#CBD2D9" text-anchor="middle">e interrogazione</text>
<text xml:space="preserve" x="1215" y="340" font-size="23" fill="#3E4C59">grafici, ricerche,</text>
<text xml:space="preserve" x="1215" y="372" font-size="23" fill="#3E4C59">dashboard</text>
<rect x="1195" y="430" width="335" height="140" rx="12" fill="#E7F0FD" stroke="#1C64C8" stroke-width="3"/>
<text xml:space="preserve" x="1215" y="490" font-size="25" fill="#1F2933" font-weight="bold">Grafana,</text>
<text xml:space="preserve" x="1215" y="528" font-size="25" fill="#1F2933" font-weight="bold">Kibana</text>
<rect x="1195" y="630" width="335" height="140" rx="12" fill="#FFF5F5" stroke="#C92A2A" stroke-width="3"/>
<text xml:space="preserve" x="1215" y="690" font-size="25" fill="#1F2933" font-weight="bold">Grafana,</text>
<text xml:space="preserve" x="1215" y="728" font-size="25" fill="#1F2933" font-weight="bold">Zabbix</text>
<text xml:space="preserve" x="70" y="418" font-size="22" fill="#1C64C8" font-weight="bold">LOG</text>
<text xml:space="preserve" x="70" y="618" font-size="22" fill="#C92A2A" font-weight="bold">METRICHE</text>
<text xml:space="preserve" x="70" y="840" font-size="28" fill="#1F2933" font-weight="bold">L'alerting parte dallo storage: è una query che gira da sola, ogni pochi secondi.</text>
</svg>

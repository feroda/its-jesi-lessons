<text xml:space="preserve" x="800" y="310" font-size="52" fill="#2F9E44" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">restart: unless-stopped</text>
<text x="800" y="440" font-size="32" fill="#1F2933" font-weight="bold" text-anchor="middle">Riparte da solo se si ferma o se il server si riavvia.</text>
<text x="800" y="490" font-size="32" fill="#1F2933" text-anchor="middle">Resta fermo solo se l'hai fermato tu.</text>
<text x="800" y="580" font-size="28" fill="#3E4C59" text-anchor="middle">Il compose di Alloy ce l'ha già.</text>
<rect x="250" y="640" width="1100" height="128" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="280" y="690" font-size="26" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ sudo systemctl restart docker</text>
<text xml:space="preserve" x="280" y="733" font-size="26" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">$ docker compose ps    # prima senza, poi con</text>

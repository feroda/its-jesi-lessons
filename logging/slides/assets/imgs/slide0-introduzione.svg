    <circle cx="1036" cy="489" r="6" fill="#E12D39"/>
    <circle cx="1056" cy="489" r="6" fill="#F0B429"/>
    <circle cx="1076" cy="489" r="6" fill="#27AB83"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#52606D">
      <text x="1032" y="548">Sep 28 02:47:03 srv sshd: Failed</text>
      <text x="1032" y="580">Sep 28 02:47:04 srv sshd: Failed</text>

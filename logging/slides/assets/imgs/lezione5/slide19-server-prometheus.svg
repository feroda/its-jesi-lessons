<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Il server: arriva Prometheus</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Un servizio in più in vps-corso/compose.yml</text>
<rect x="70" y="180" width="1060" height="558" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="225" font-size="22" fill="#C92A2A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">  prometheus:</text>
<text xml:space="preserve" x="102" y="265" font-size="22" fill="#2496ED" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    image: prom/prometheus:v3.15.0</text>
<text xml:space="preserve" x="102" y="305" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    command:</text>
<text xml:space="preserve" x="102" y="345" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - --config.file=/etc/prometheus/prometheus.yml</text>
<text xml:space="preserve" x="102" y="385" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - --storage.tsdb.path=/prometheus</text>
<text xml:space="preserve" x="102" y="425" font-size="22" fill="#C92A2A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - --storage.tsdb.retention.time=15d</text>
<text xml:space="preserve" x="102" y="465" font-size="22" fill="#C92A2A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - --web.enable-remote-write-receiver</text>
<text xml:space="preserve" x="102" y="505" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    volumes:</text>
<text xml:space="preserve" x="102" y="545" font-size="22" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro</text>
<text xml:space="preserve" x="102" y="585" font-size="22" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - prometheus-data:/prometheus</text>
<text xml:space="preserve" x="102" y="625" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    ports:</text>
<text xml:space="preserve" x="102" y="665" font-size="22" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - "9090:9090"</text>
<text xml:space="preserve" x="102" y="705" font-size="22" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    restart: unless-stopped</text>
<text xml:space="preserve" x="1160" y="425" font-size="28" fill="#C92A2A" font-weight="bold">← retention</text>
<text xml:space="preserve" x="1160" y="465" font-size="28" fill="#C92A2A" font-weight="bold">← accetta il push</text>
<text xml:space="preserve" x="1160" y="585" font-size="28" fill="#B7791F" font-weight="bold">← il database</text>
<text xml:space="preserve" x="1160" y="665" font-size="28" fill="#0C8599" font-weight="bold">← web e push</text>
<text xml:space="preserve" x="70" y="800" font-size="28" fill="#3E4C59">In fondo al file, tra i volumes, una riga in più: prometheus-data:</text>
</svg>

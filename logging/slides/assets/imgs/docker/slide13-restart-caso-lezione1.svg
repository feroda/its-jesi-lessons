<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="72" font-size="40" font-weight="bold" fill="#1F2933">Riapriamo il caso della lezione 1</text>
<text x="60" y="110" font-size="22" fill="#52606D">Perché Grafana non era ripartito da solo? Leggiamo il compose.yml di befair3</text>
<rect x="60" y="145" width="600" height="560" rx="12" fill="#F5F7FA" stroke="#3E4C59" stroke-width="3"/>
<text x="80" y="180" font-size="16" font-weight="bold" fill="#52606D" font-family="DejaVu Sans Mono, monospace">/opt/loki-grafana/compose.yml</text>
<text xml:space="preserve" x="90" y="215" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">services:</text>
<text xml:space="preserve" x="90" y="271" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  loki:</text>
<text xml:space="preserve" x="90" y="299" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    image: grafana/loki:3.7.0</text>
<text xml:space="preserve" x="90" y="327" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    command: -config.file=/etc/loki/config.yml</text>
<text xml:space="preserve" x="90" y="355" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    volumes: ...</text>
<text xml:space="preserve" x="90" y="383" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    ports:</text>
<text xml:space="preserve" x="90" y="411" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - "3100:3100"</text>
<rect x="75" y="418" width="560" height="28" fill="#FFE3E3"/><text xml:space="preserve" x="90" y="439" font-size="18" font-weight="bold" fill="#C92A2A" font-family="DejaVu Sans Mono, monospace">    # restart: ???</text>
<text xml:space="preserve" x="90" y="495" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  grafana:</text>
<text xml:space="preserve" x="90" y="523" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    image: grafana/grafana:latest</text>
<text xml:space="preserve" x="90" y="551" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    ports:</text>
<text xml:space="preserve" x="90" y="579" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - "3000:3000"</text>
<text xml:space="preserve" x="90" y="607" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    volumes: ...</text>
<text xml:space="preserve" x="90" y="635" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    depends_on:</text>
<text xml:space="preserve" x="90" y="663" font-size="18" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - loki</text>
<rect x="75" y="670" width="560" height="28" fill="#FFE3E3"/><text xml:space="preserve" x="90" y="691" font-size="18" font-weight="bold" fill="#C92A2A" font-family="DejaVu Sans Mono, monospace">    # restart: ???</text>
<line x1="745" y1="200" x2="745" y2="515" stroke="#CBD2D9" stroke-width="4"/>
<circle cx="745" cy="200" r="14" fill="#52606D"/>
<text x="775" y="192" font-size="17" font-weight="bold" fill="#52606D">03:30 UTC</text>
<text x="775" y="220" font-size="21" font-weight="bold" fill="#1F2933">Grafana e Loki si spengono</text>
<text x="775" y="247" font-size="17" fill="#52606D">nei log: Shutting down (docker compose logs)</text>
<circle cx="745" cy="305" r="14" fill="#C92A2A"/>
<text x="775" y="297" font-size="17" font-weight="bold" fill="#C92A2A">dopo</text>
<text x="775" y="325" font-size="21" font-weight="bold" fill="#1F2933">Nessuno li riaccende</text>
<text x="775" y="352" font-size="17" fill="#52606D">senza restart restano Exited. Chi li ha spenti? journalctl -u docker</text>
<circle cx="745" cy="410" r="14" fill="#E8590C"/>
<text x="775" y="402" font-size="17" font-weight="bold" fill="#E8590C">mattina</text>
<text x="775" y="430" font-size="21" font-weight="bold" fill="#1F2933">Il browser: servizio irraggiungibile</text>
<text x="775" y="457" font-size="17" fill="#52606D">è l'inizio della lezione 1</text>
<circle cx="745" cy="515" r="14" fill="#2F9E44"/>
<text x="775" y="507" font-size="17" font-weight="bold" fill="#2F9E44">in aula</text>
<text x="775" y="535" font-size="21" font-weight="bold" fill="#1F2933">docker compose up -d</text>
<text x="775" y="562" font-size="17" fill="#52606D">ripartono a mano. Funziona, ma è una toppa</text>
<rect x="700" y="600" width="840" height="105" rx="12" fill="#E3F6E8" stroke="#2F9E44" stroke-width="3"/>
<text x="725" y="640" font-size="21" font-weight="bold" fill="#2F9E44">La cura: una riga per servizio</text>
<text xml:space="preserve" x="725" y="680" font-size="20" font-weight="bold" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    restart: unless-stopped</text>
<text x="1140" y="680" font-size="17" fill="#3E4C59">Il compose di Alloy ce l'ha già.</text>

<text x="60" y="760" font-size="21" font-weight="bold" fill="#1F2933">Le politiche di restart</text>
<g font-size="18" fill="#3E4C59">
<text x="60" y="798"><tspan font-family="DejaVu Sans Mono, monospace" font-weight="bold" fill="#C92A2A">no</tspan>  (predefinita) non riparte mai</text>
<text x="60" y="830"><tspan font-family="DejaVu Sans Mono, monospace" font-weight="bold" fill="#1F2933">on-failure</tspan>  solo se esce con un errore</text>
<text x="760" y="798"><tspan font-family="DejaVu Sans Mono, monospace" font-weight="bold" fill="#1F2933">always</tspan>  sempre, anche se l'avevi fermato tu</text>
<text x="760" y="830"><tspan font-family="DejaVu Sans Mono, monospace" font-weight="bold" fill="#2F9E44">unless-stopped</tspan>  sempre, tranne se l'hai fermato tu</text>
</g>
<text x="60" y="872" font-size="17" fill="#52606D">Prova in aula: con i container accesi, sudo systemctl restart docker. Prima senza restart, poi con unless-stopped.</text>
</svg>

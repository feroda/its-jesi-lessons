<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Da docker run a compose.yml</text>
<rect x="70" y="190" width="1460" height="90" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="102" y="244" font-size="30" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker run -d --name web -p 8080:80 nginx:alpine</text>
<text xml:space="preserve" x="70" y="365" font-size="28" fill="#52606D" font-weight="bold" font-family="DejaVu Sans Mono, monospace">compose.yml</text>
<rect x="70" y="390" width="900" height="308" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="451" font-size="32" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">services:</text>
<text xml:space="preserve" x="102" y="502" font-size="32" fill="#C2255C" font-weight="bold" font-family="DejaVu Sans Mono, monospace">  web:</text>
<text xml:space="preserve" x="102" y="553" font-size="32" fill="#2496ED" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    image: nginx:alpine</text>
<text xml:space="preserve" x="102" y="604" font-size="32" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    ports:</text>
<text xml:space="preserve" x="102" y="655" font-size="32" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - "8080:80"</text>
<text xml:space="preserve" x="1020" y="480" font-size="34" fill="#1F2933" font-weight="bold">Stesso container,</text>
<text xml:space="preserve" x="1020" y="530" font-size="34" fill="#1F2933" font-weight="bold">scritto in un file.</text>
<text xml:space="preserve" x="1020" y="620" font-size="30" fill="#3E4C59">Si legge, si copia,</text>
<text xml:space="preserve" x="1020" y="665" font-size="30" fill="#3E4C59">si versiona con git.</text>
<text xml:space="preserve" x="1020" y="750" font-size="30" fill="#3E4C59">YAML: spazi, mai tab.</text>

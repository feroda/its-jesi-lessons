<text x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">I log di nginx</text>
<text x="70" y="152" font-size="27" fill="#52606D">Ogni ricarica del browser è una riga</text>
<rect x="70" y="195" width="1460" height="310" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="100" y="243" font-size="23" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker logs web-07</text>
<text xml:space="preserve" x="100" y="281" font-size="23" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">203.0.113.25 - - [15/Oct/2026:09:12:44 +0000] "GET / HTTP/1.1" 200 615 ...</text>
<text xml:space="preserve" x="100" y="319" font-size="23" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">203.0.113.25 - - [15/Oct/2026:09:12:51 +0000] "GET /pippo HTTP/1.1" 404 ...</text>
<text xml:space="preserve" x="100" y="395" font-size="23" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker logs web-07 2&gt;/dev/null | awk '{print $1}' | sort | uniq -c</text>
<text xml:space="preserve" x="100" y="433" font-size="23" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">     14 203.0.113.25</text>
<text xml:space="preserve" x="100" y="471" font-size="23" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">      3 198.51.100.7</text>
<text x="800" y="680" font-size="28" fill="#1F2933" font-weight="bold" text-anchor="middle">Quasi il formato di apache_access.log: valgono i comandi della lezione 2.</text>
<text x="800" y="740" font-size="28" fill="#3E4C59" text-anchor="middle">L'ora è in UTC (+0000): 09:12 UTC sono le 11:12 in Italia.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Tenere d'occhio il disco</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Log e metriche crescono ogni giorno</text>
<text xml:space="preserve" x="70" y="225" font-size="32" fill="#2496ED" font-weight="bold">Misurare</text>
<rect x="70" y="250" width="700" height="239" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="102" y="298" font-size="23" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ df -h /</text>
<text xml:space="preserve" x="102" y="350" font-size="23" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ docker system df</text>
<text xml:space="preserve" x="102" y="402" font-size="23" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ sudo du -sh /var/lib/docker/volumes/*</text>
<text xml:space="preserve" x="102" y="454" font-size="23" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ journalctl --disk-usage</text>
<text xml:space="preserve" x="820" y="225" font-size="32" fill="#B7791F" font-weight="bold">Limitare (retention)</text>
<rect x="820" y="250" width="710" height="413" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="852" y="292" font-size="20" fill="#9AA5B1" font-family="DejaVu Sans Mono, monospace"># Prometheus (compose.yml)</text>
<text xml:space="preserve" x="852" y="323" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">--storage.tsdb.retention.time=15d</text>
<text xml:space="preserve" x="852" y="354" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace"></text>
<text xml:space="preserve" x="852" y="385" font-size="20" fill="#9AA5B1" font-family="DejaVu Sans Mono, monospace"># Loki (config.yml)</text>
<text xml:space="preserve" x="852" y="416" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">limits_config:</text>
<text xml:space="preserve" x="852" y="447" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  retention_period: 744h</text>
<text xml:space="preserve" x="852" y="478" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">compactor:</text>
<text xml:space="preserve" x="852" y="509" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  retention_enabled: true</text>
<text xml:space="preserve" x="852" y="540" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  delete_request_store: filesystem</text>
<text xml:space="preserve" x="852" y="571" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace"></text>
<text xml:space="preserve" x="852" y="602" font-size="20" fill="#9AA5B1" font-family="DejaVu Sans Mono, monospace"># journald (/etc/systemd/journald.conf)</text>
<text xml:space="preserve" x="852" y="633" font-size="20" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">SystemMaxUse=500M</text>
<text xml:space="preserve" x="70" y="600" font-size="30" fill="#1F2933" font-weight="bold">Retention giusta =</text>
<text xml:space="preserve" x="70" y="645" font-size="28" fill="#1F2933">quanto indietro devo poter guardare</text>
<text xml:space="preserve" x="70" y="690" font-size="28" fill="#1F2933">e quanto disco ho a disposizione.</text>
<text xml:space="preserve" x="70" y="850" font-size="27" fill="#C92A2A" font-weight="bold">Disco pieno: Loki e Prometheus smettono di scrivere, e si perdono proprio i dati del guasto.</text>
</svg>

<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Il sito non risponde</text>
<text x="70" y="152" font-size="27" fill="#52606D">Un livello alla volta, come nelle lezioni 1 e 2</text>
<rect x="70" y="200" width="1460" height="125" rx="16" fill="#FFFFFF" stroke="#0C8599" stroke-width="3"/>
<circle cx="125" cy="262" r="28" fill="#0C8599"/><text x="125" y="273" font-size="30" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text xml:space="preserve" x="180" y="275" font-size="32" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">nc -zv IP-VPS 8007</text>
<text x="920" y="275" font-size="30" fill="#1F2933">dal PC: la porta risponde?</text>

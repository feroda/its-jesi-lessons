<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Due cose da sapere sulle porte</text>
<rect x="70" y="200" width="715" height="600" rx="16" fill="#FFFFFF"/>
<text x="110" y="265" font-size="34" fill="#C92A2A" font-weight="bold">Porta già occupata</text>
<rect x="110" y="300" width="635" height="150" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="140" y="346" font-size="21" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker run ... -p 8007:80 ...</text>
<text xml:space="preserve" x="140" y="381" font-size="21" fill="#FF8787" font-family="DejaVu Sans Mono, monospace">Error ... Bind for 0.0.0.0:8007</text>
<text xml:space="preserve" x="140" y="416" font-size="21" fill="#FF8787" font-family="DejaVu Sans Mono, monospace">failed: port is already allocated</text>
<text x="110" y="520" font-size="28" fill="#1F2933">La porta in facciata è una sola.</text>
<text x="110" y="565" font-size="28" fill="#1F2933">Se la prende un compagno, il tuo</text>
<text x="110" y="610" font-size="28" fill="#1F2933">run fallisce. Leggi l'errore.</text>
<rect x="815" y="200" width="715" height="600" rx="16" fill="#FFFFFF"/>
<text x="855" y="265" font-size="34" fill="#C2255C" font-weight="bold">È su Internet</text>
<text x="855" y="340" font-size="28" fill="#1F2933">Una porta pubblicata con -p è</text>
<text x="855" y="385" font-size="28" fill="#1F2933">aperta a tutti, anche se il</text>
<text x="855" y="430" font-size="28" fill="#1F2933">firewall ufw dice di no.</text>
<text x="855" y="510" font-size="28" fill="#3E4C59">Solo dal server stesso:</text>
<text xml:space="preserve" x="855" y="560" font-size="28" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">-p 127.0.0.1:8007:80</text>
<text x="855" y="650" font-size="28" fill="#3E4C59">A fine lezione:</text>
<text xml:space="preserve" x="855" y="700" font-size="28" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">docker rm -f web-07</text>
</svg>

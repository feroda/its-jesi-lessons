<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Perché è il PC a spedire</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Livello 3: chi riesce a raggiungere chi?</text>
<rect x="70" y="230" width="500" height="520" rx="18" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3" stroke-dasharray="10 8"/>
<text xml:space="preserve" x="300" y="290" font-size="26" fill="#52606D" font-weight="bold" text-anchor="middle">casa o scuola (rete privata)</text>
<rect x="100" y="420" width="310" height="140" rx="12" fill="#EBFBEE" stroke="#2F9E44" stroke-width="3"/>
<text xml:space="preserve" x="255.0" y="483.0" font-size="32" fill="#2F9E44" font-weight="bold" text-anchor="middle">il tuo PC</text>
<text xml:space="preserve" x="255.0" y="522.0" font-size="26" fill="#52606D" text-anchor="middle">192.168.1.23</text>
<line x1="415" y1="490" x2="462" y2="490" stroke="#2F9E44" stroke-width="5" marker-end="url(#aG)"/>
<rect x="470" y="400" width="200" height="180" rx="12" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="570.0" y="484.4" font-size="32" fill="#3E4C59" font-weight="bold" text-anchor="middle">router</text>
<text xml:space="preserve" x="570.0" y="520.4" font-size="24" fill="#52606D" text-anchor="middle">IP pubblico</text>
<rect x="1080" y="420" width="450" height="140" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="3"/>
<text xml:space="preserve" x="1305.0" y="485.8" font-size="36" fill="#1F2933" font-weight="bold" text-anchor="middle">VPS</text>
<text xml:space="preserve" x="1305.0" y="521.8" font-size="24" fill="#52606D" text-anchor="middle">IP pubblico</text>
<line x1="675" y1="450" x2="1070" y2="450" stroke="#2F9E44" stroke-width="6" marker-end="url(#aG)"/>
<text xml:space="preserve" x="872" y="425" font-size="26" fill="#2F9E44" font-weight="bold" text-anchor="middle">il PC raggiunge il VPS</text>
<line x1="1070" y1="540" x2="680" y2="540" stroke="#C92A2A" stroke-width="6" marker-end="url(#aR)" stroke-dasharray="14 10"/>
<text xml:space="preserve" x="872" y="595" font-size="26" fill="#C92A2A" font-weight="bold" text-anchor="middle">il VPS vede solo il router</text>
<text xml:space="preserve" x="70" y="820" font-size="32" fill="#1F2933" font-weight="bold">Quindi è Alloy, sul PC, ad aprire la connessione e spedire.</text>

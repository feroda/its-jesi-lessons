<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">I comandi di docker compose</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Sempre dalla cartella dove c'è il compose.yml</text>
<circle cx="110" cy="278" r="26" fill="#2496ED"/><text xml:space="preserve" x="110" y="288" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text xml:space="preserve" x="165" y="290" font-size="32" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">docker compose up -d</text>
<text xml:space="preserve" x="1530" y="290" font-size="28" fill="#3E4C59" text-anchor="end">avvia tutto</text>
<circle cx="110" cy="388" r="26" fill="#2496ED"/><text xml:space="preserve" x="110" y="398" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text xml:space="preserve" x="165" y="400" font-size="32" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">docker compose ps</text>
<text xml:space="preserve" x="1530" y="400" font-size="28" fill="#3E4C59" text-anchor="end">chi gira?</text>
<circle cx="110" cy="498" r="26" fill="#2496ED"/><text xml:space="preserve" x="110" y="508" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text xml:space="preserve" x="165" y="510" font-size="32" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">docker compose logs -f alloy</text>
<text xml:space="preserve" x="1530" y="510" font-size="28" fill="#3E4C59" text-anchor="end">log in tempo reale</text>
<circle cx="110" cy="608" r="26" fill="#2496ED"/><text xml:space="preserve" x="110" y="618" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<text xml:space="preserve" x="165" y="620" font-size="32" fill="#1F2933" font-weight="bold" font-family="DejaVu Sans Mono, monospace">docker compose down</text>
<text xml:space="preserve" x="1530" y="620" font-size="28" fill="#3E4C59" text-anchor="end">ferma e cancella i container</text>
<text xml:space="preserve" x="70" y="760" font-size="30" fill="#3E4C59">I volumi restano: down non cancella i dati.</text>
</svg>

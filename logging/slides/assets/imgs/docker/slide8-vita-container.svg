<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Dov'è finito?</text>
<text x="70" y="152" font-size="27" fill="#52606D">docker ps mostra solo i container accesi</text>
<rect x="70" y="200" width="1460" height="319" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="100" y="252" font-size="28" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker ps</text>
<text xml:space="preserve" x="100" y="298" font-size="28" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">CONTAINER ID   IMAGE   STATUS</text>
<text xml:space="preserve" x="100" y="391" font-size="28" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">$ docker ps -a</text>
<text xml:space="preserve" x="100" y="437" font-size="28" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">CONTAINER ID   IMAGE         STATUS</text>
<text xml:space="preserve" x="100" y="483" font-size="28" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace">4c1d2e9f0a1b   hello-world   Exited (0) 10 seconds ago</text>
<text x="800" y="690" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="middle">Un container vive quanto il suo processo.</text>
<text x="800" y="750" font-size="28" fill="#3E4C59" text-anchor="middle">hello-world stampa e termina: il container resta lì, fermo.</text>
</svg>

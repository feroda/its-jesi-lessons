<text x="140" y="685" font-size="32" fill="#1F2933" font-weight="bold">Per la lezione 4</text>
<text x="140" y="740" font-size="30" fill="#3E4C59">Sul vostro PC funziona docker run hello-world?</text>
<text x="140" y="790" font-size="30" fill="#3E4C59">Annotate se usate Linux, WSL2 o Docker Desktop.</text>

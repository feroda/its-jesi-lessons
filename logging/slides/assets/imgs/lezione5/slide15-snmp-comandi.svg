<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">SNMP in pratica</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">La stessa domanda (da quanto è acceso l'apparato?) in v2c e in v3</text>
<text xml:space="preserve" x="70" y="240" font-size="28" fill="#C92A2A" font-weight="bold">v2c: basta la community, che viaggia in chiaro</text>
<rect x="70" y="260" width="1460" height="122" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="102" y="307" font-size="24" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ snmpget -v2c -c public 192.168.1.1 1.3.6.1.2.1.1.3.0</text>
<text xml:space="preserve" x="102" y="349" font-size="24" fill="#8CE99A" font-family="DejaVu Sans Mono, monospace">iso.3.6.1.2.1.1.3.0 = Timeticks: (8640000) 1 day, 0:00:00.00</text>
<text xml:space="preserve" x="70" y="452" font-size="28" fill="#2F9E44" font-weight="bold">v3: utente, autenticazione (SHA) e cifratura (AES)</text>
<rect x="70" y="472" width="1460" height="122" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="102" y="519" font-size="24" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ snmpget -v3 -l authPriv -u monitor -a SHA -A &lt;pwd&gt; -x AES -X &lt;pwd&gt; \</text>
<text xml:space="preserve" x="102" y="561" font-size="24" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      192.168.1.1 1.3.6.1.2.1.1.3.0</text>
<text xml:space="preserve" x="70" y="664" font-size="28" fill="#1F2933">1.3.6.1.2.1.1.3.0 è l'OID di sysUpTime: il tempo dall'ultimo avvio.</text>
<text xml:space="preserve" x="70" y="724" font-size="28" fill="#C92A2A" font-weight="bold">Con tcpdump sulla porta UDP 161 la community di v2c si legge; con v3 no.</text>
</svg>

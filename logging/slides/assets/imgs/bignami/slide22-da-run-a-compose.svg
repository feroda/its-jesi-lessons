<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Da docker run a compose.yml</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">La stessa riga, scritta in un file</text>
<rect x="70" y="190" width="1460" height="90" rx="14" fill="#1F2933"/>
<text xml:space="preserve" x="102" y="244" font-size="30" fill="#FFFFFF" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$ docker run -d --name grafana -p 3000:3000 grafana/grafana</text>
<line x1="520" y1="288" x2="520" y2="360" stroke="#1F2933" stroke-width="5" marker-end="url(#aK)"/>
<rect x="70" y="370" width="900" height="372" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="430" font-size="30" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">services:</text>
<text xml:space="preserve" x="102" y="484" font-size="30" fill="#E8590C" font-weight="bold" font-family="DejaVu Sans Mono, monospace">  grafana:</text>
<text xml:space="preserve" x="102" y="538" font-size="30" fill="#2496ED" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    image: grafana/grafana</text>
<text xml:space="preserve" x="102" y="592" font-size="30" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    ports:</text>
<text xml:space="preserve" x="102" y="646" font-size="30" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - "3000:3000"</text>
<text xml:space="preserve" x="102" y="700" font-size="30" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    restart: unless-stopped</text>
<text xml:space="preserve" x="1010" y="484" font-size="30" fill="#E8590C" font-weight="bold">← --name</text>
<text xml:space="preserve" x="1010" y="538" font-size="30" fill="#2496ED" font-weight="bold">← l'immagine</text>
<text xml:space="preserve" x="1010" y="646" font-size="30" fill="#0C8599" font-weight="bold">← -p</text>
<text xml:space="preserve" x="1010" y="700" font-size="30" fill="#2F9E44" font-weight="bold">← in più: riparte da solo,</text>
<text xml:space="preserve" x="1060" y="742" font-size="30" fill="#2F9E44" font-weight="bold">anche dopo un riavvio</text>
</svg>

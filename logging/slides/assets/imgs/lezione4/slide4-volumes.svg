<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">volumes: i dati stanno fuori</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Due modi di mettere qualcosa dentro un container</text>
<rect x="70" y="210" width="1460" height="90" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="265" font-size="34" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">loki-data:/loki</text>
<text xml:space="preserve" x="110" y="360" font-size="32" fill="#1F2933" font-weight="bold">Un disco gestito da Docker.</text>
<text xml:space="preserve" x="110" y="410" font-size="30" fill="#3E4C59">Butti via il container, i log restano.</text>
<rect x="70" y="490" width="1460" height="90" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="545" font-size="34" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">./loki/config.yml:/etc/loki/config.yml:ro</text>
<text xml:space="preserve" x="110" y="640" font-size="32" fill="#1F2933" font-weight="bold">Un file della tua cartella, visto dentro il container.</text>
<text xml:space="preserve" x="110" y="690" font-size="30" fill="#3E4C59">:ro = sola lettura: il container lo legge, non lo cambia.</text>

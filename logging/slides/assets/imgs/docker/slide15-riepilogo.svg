<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<rect x="0" y="0" width="28" height="900" fill="#1C64C8"/><rect x="28" y="0" width="10" height="900" fill="#2496ED"/>
<text x="80" y="90" font-size="44" font-weight="bold" fill="#1F2933">Prima di uscire</text>
<text x="80" y="160" font-size="24" font-weight="bold" fill="#2496ED">Rispondete in poche righe</text>
<circle cx="100" cy="222" r="18" fill="#2496ED"/><text x="100" y="230" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="130" y="230" font-size="22" fill="#1F2933">Che differenza c'è tra un'immagine e un container?</text>
<circle cx="100" cy="282" r="18" fill="#2496ED"/><text x="100" y="290" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="130" y="290" font-size="22" fill="#1F2933">Dove leggo i log di un container?</text>
<circle cx="100" cy="342" r="18" fill="#2496ED"/><text x="100" y="350" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="130" y="350" font-size="22" fill="#1F2933">E quelli del demone Docker?</text>
<circle cx="100" cy="402" r="18" fill="#2496ED"/><text x="100" y="410" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="130" y="410" font-size="22" fill="#1F2933">Cosa fa restart: unless-stopped, e perché</text>
<text x="130" y="444" font-size="22" fill="#1F2933">sarebbe servito nella lezione 1?</text>
<rect x="80" y="560" width="740" height="250" rx="14" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="2"/>
<text x="105" y="602" font-size="22" font-weight="bold" fill="#1F2933">Per la prossima lezione</text>
<g font-size="19" fill="#3E4C59">
<text x="105" y="645">• Sul vostro PC: docker run hello-world funziona?</text>
<text x="128" y="675">Linux, WSL2 o Docker Desktop: annotate quale.</text>
<text x="105" y="715">• Leggete logging/journal-alloy/compose.yml:</text>
<text x="128" y="745">quali volumi monta, e perché in sola lettura?</text>
<text x="105" y="785">• Lezione 4: Alloy manda i vostri log al VPS.</text>
</g>
<rect x="870" y="140" width="670" height="700" rx="14" fill="#1F2933"/>
<text x="900" y="185" font-size="20" font-weight="bold" fill="#7BC47F">I comandi di oggi</text>
<text xml:space="preserve" x="900" y="225" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker run -d --name N -p E:I img</text><text x="1300" y="225" font-size="16" fill="#9FB3C8">avvia un container</text>
<text xml:space="preserve" x="900" y="277" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker ps  /  docker ps -a</text><text x="1300" y="277" font-size="16" fill="#9FB3C8">accesi / tutti</text>
<text xml:space="preserve" x="900" y="329" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker logs -f N</text><text x="1300" y="329" font-size="16" fill="#9FB3C8">log del container</text>
<text xml:space="preserve" x="900" y="381" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker exec -it N sh</text><text x="1300" y="381" font-size="16" fill="#9FB3C8">entra nel container</text>
<text xml:space="preserve" x="900" y="433" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker rm -f N</text><text x="1300" y="433" font-size="16" fill="#9FB3C8">ferma e cancella</text>
<text xml:space="preserve" x="900" y="485" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker images</text><text x="1300" y="485" font-size="16" fill="#9FB3C8">immagini scaricate</text>
<text xml:space="preserve" x="900" y="537" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker compose up -d</text><text x="1300" y="537" font-size="16" fill="#9FB3C8">avvia il progetto</text>
<text xml:space="preserve" x="900" y="589" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker compose ps</text><text x="1300" y="589" font-size="16" fill="#9FB3C8">stato del progetto</text>
<text xml:space="preserve" x="900" y="641" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker compose logs -f S</text><text x="1300" y="641" font-size="16" fill="#9FB3C8">log di un servizio</text>
<text xml:space="preserve" x="900" y="693" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">docker compose down</text><text x="1300" y="693" font-size="16" fill="#9FB3C8">ferma e cancella</text>
<text xml:space="preserve" x="900" y="745" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace">journalctl -u docker</text><text x="1300" y="745" font-size="16" fill="#9FB3C8">log del demone</text>
</svg>

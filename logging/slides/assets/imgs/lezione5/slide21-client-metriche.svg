<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Il client: Alloy fa da node exporter</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Tre blocchi in più in pc-studente/alloy/config.alloy</text>
<rect x="70" y="180" width="1060" height="644" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="223" font-size="22" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">prometheus.exporter.unix "pc" {</text>
<text xml:space="preserve" x="102" y="261" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  procfs_path = "/host/proc"</text>
<text xml:space="preserve" x="102" y="299" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  sysfs_path  = "/host/sys"</text>
<text xml:space="preserve" x="102" y="337" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">}</text>
<text xml:space="preserve" x="102" y="375" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace"></text>
<text xml:space="preserve" x="102" y="413" font-size="22" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">prometheus.scrape "pc" {</text>
<text xml:space="preserve" x="102" y="451" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  targets    = prometheus.exporter.unix.pc.targets</text>
<text xml:space="preserve" x="102" y="489" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  forward_to = [prometheus.remote_write.vps.receiver]</text>
<text xml:space="preserve" x="102" y="527" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">}</text>
<text xml:space="preserve" x="102" y="565" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace"></text>
<text xml:space="preserve" x="102" y="603" font-size="22" fill="#C92A2A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">prometheus.remote_write "vps" {</text>
<text xml:space="preserve" x="102" y="641" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  endpoint {</text>
<text xml:space="preserve" x="102" y="679" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    url = "http://its.fabersoft.net:9090/api/v1/write"</text>
<text xml:space="preserve" x="102" y="717" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  }</text>
<text xml:space="preserve" x="102" y="755" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  external_labels = { host = constants.hostname }</text>
<text xml:space="preserve" x="102" y="793" font-size="22" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">}</text>
<text xml:space="preserve" x="1180" y="223" font-size="32" fill="#2F9E44" font-weight="bold">1. misura il PC</text>
<text xml:space="preserve" x="1180" y="413" font-size="32" fill="#0C8599" font-weight="bold">2. raccogli</text>
<text xml:space="preserve" x="1180" y="457" font-size="26" fill="#3E4C59">ogni 15 s</text>
<text xml:space="preserve" x="1180" y="603" font-size="32" fill="#C92A2A" font-weight="bold">3. spedisci</text>
<text xml:space="preserve" x="1180" y="647" font-size="26" fill="#3E4C59">a Prometheus,</text>
<text xml:space="preserve" x="1180" y="689" font-size="26" fill="#3E4C59">con l'etichetta host</text>
</svg>

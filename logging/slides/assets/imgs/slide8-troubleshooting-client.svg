<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="66" font-size="38" font-weight="bold" fill="#1F2933">Dal client: un livello alla volta</text>
<text x="60" y="104" font-size="21" fill="#52606D">Si sale dal basso: prima il centro commerciale, poi la porta, poi la lingua del negozio</text>
<rect x="50" y="135" width="1500" height="236" rx="14" fill="#F7F5FF" stroke="#6741D9" stroke-width="3"/>
<rect x="72" y="157" width="182" height="30" rx="15" fill="#6741D9"/>
<text x="86" y="178" font-size="16" font-weight="bold" fill="#FFFFFF">LIVELLO 3 · IP</text>
<text x="72" y="233" font-size="40" font-weight="bold" fill="#6741D9" font-family="DejaVu Sans Mono, monospace">ping</text>
<text x="72" y="271" font-size="19" fill="#1F2933" font-weight="bold">Il centro commerciale</text>
<text x="72" y="297" font-size="19" fill="#1F2933" font-weight="normal">esiste ed è raggiungibile?</text>
<rect x="430" y="155" width="620" height="196" rx="10" fill="#1F2933"/>
<text x="450" y="187" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">$ ping -c 3 befair3.befair.it</text>
<text x="450" y="214" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">PING befair3.befair.it (128.140.61.87)</text>
<text x="450" y="241" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">3 packets transmitted, 0 received, 100% loss</text>
<text x="450" y="268" font-size="17" fill="#7BC47F" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"># befair3 non risponde... eppure è acceso</text>
<text x="1075" y="185" font-size="17" font-weight="bold" fill="#6741D9">Attenzione</text>
<text x="1075" y="215" font-size="17" fill="#3E4C59">Molti server bloccano il ping (ICMP).</text>
<text x="1075" y="240" font-size="17" fill="#3E4C59">befair3 non risponde al ping</text>
<text x="1075" y="265" font-size="17" fill="#3E4C59">ma è acceso: lo abbiamo visto</text>
<text x="1075" y="290" font-size="17" fill="#3E4C59">nella lezione 1. Nessuna risposta</text>
<text x="1075" y="315" font-size="17" fill="#3E4C59">non vuol dire "server spento".</text>
<rect x="50" y="385" width="1500" height="236" rx="14" fill="#F0FCFD" stroke="#0C8599" stroke-width="3"/>
<rect x="72" y="407" width="215" height="30" rx="15" fill="#0C8599"/>
<text x="86" y="428" font-size="16" font-weight="bold" fill="#FFFFFF">LIVELLO 4 · PORTA</text>
<text x="72" y="483" font-size="40" font-weight="bold" fill="#0C8599" font-family="DejaVu Sans Mono, monospace">nc</text>
<text x="72" y="521" font-size="19" fill="#1F2933" font-weight="bold">Il negozio è aperto?</text>
<text x="72" y="547" font-size="19" fill="#1F2933" font-weight="normal">C'è qualcuno sulla porta?</text>
<rect x="430" y="405" width="620" height="196" rx="10" fill="#1F2933"/>
<text x="450" y="437" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">$ nc -zv befair3.befair.it 3100</text>
<text x="450" y="464" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Connection to befair3.befair.it 3100</text>
<text x="450" y="491" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  port [tcp/*] succeeded!</text>
<text x="450" y="518" font-size="17" fill="#7BC47F" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"># oppure: telnet befair3.befair.it 3100</text>
<text x="1075" y="435" font-size="17" font-weight="bold" fill="#0C8599">Come leggerlo</text>
<text x="1075" y="465" font-size="17" fill="#3E4C59">succeeded: la porta è aperta.</text>
<text x="1075" y="490" font-size="17" fill="#3E4C59">refused: il server c'è,</text>
<text x="1075" y="515" font-size="17" fill="#3E4C59">ma nessuno ascolta su quella porta.</text>
<text x="1075" y="540" font-size="17" fill="#3E4C59">timeout: un firewall blocca</text>
<text x="1075" y="565" font-size="17" fill="#3E4C59">o il server non è raggiungibile.</text>
<rect x="50" y="635" width="1500" height="236" rx="14" fill="#FFF5F9" stroke="#C2255C" stroke-width="3"/>
<rect x="72" y="657" width="204" height="30" rx="15" fill="#C2255C"/>
<text x="86" y="678" font-size="16" font-weight="bold" fill="#FFFFFF">LIVELLO 7 · HTTP</text>
<text x="72" y="733" font-size="40" font-weight="bold" fill="#C2255C" font-family="DejaVu Sans Mono, monospace">curl</text>
<text x="72" y="771" font-size="19" fill="#1F2933" font-weight="bold">Il negozio risponde</text>
<text x="72" y="797" font-size="19" fill="#1F2933" font-weight="normal">nella sua lingua?</text>
<rect x="430" y="655" width="620" height="196" rx="10" fill="#1F2933"/>
<text x="450" y="687" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">$ curl http://befair3.befair.it:3100/ready</text>
<text x="450" y="714" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">ready</text>
<text x="450" y="741" font-size="17" fill="#FFFFFF" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">$ curl -v http://befair3.befair.it:3000/api/health</text>
<text x="450" y="768" font-size="17" fill="#9FB3C8" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">&lt; HTTP/1.1 200 OK</text>
<text x="1075" y="685" font-size="17" font-weight="bold" fill="#C2255C">Come leggerlo</text>
<text x="1075" y="715" font-size="17" fill="#3E4C59">Con -v vedi richiesta e risposta HTTP.</text>
<text x="1075" y="740" font-size="17" fill="#3E4C59">200: il servizio risponde bene.</text>
<text x="1075" y="765" font-size="17" fill="#3E4C59">4xx/5xx: la porta è aperta, ma il</text>
<text x="1075" y="790" font-size="17" fill="#3E4C59">servizio ha un problema.</text>
<text x="1075" y="815" font-size="17" fill="#3E4C59">Alternativa: wget -qO- URL</text>
</svg>
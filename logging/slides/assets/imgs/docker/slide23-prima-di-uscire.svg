<text x="100" y="110" font-size="56" fill="#1F2933" font-weight="bold">Prima di uscire</text>
<circle cx="130" cy="210" r="26" fill="#2496ED"/><text x="130" y="220" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="180" y="220" font-size="34" fill="#1F2933">Immagine e container: che differenza c'è?</text>

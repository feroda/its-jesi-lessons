<circle cx="120" cy="508.48" r="9" fill="#C92A2A"/><text xml:space="preserve" x="150" y="520" font-size="36" fill="#1F2933">Prometheus ne ha uno dentro: la cartella /prometheus.</text>
<text xml:space="preserve" x="70" y="760" font-size="30" fill="#3E4C59">Non si cancella riga per riga: si buttano via i giorni vecchi.</text>

<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">Database a serie temporali</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">TSDB, in inglese: time series database</text>
<circle cx="120" cy="288.48" r="9" fill="#C92A2A"/><text xml:space="preserve" x="150" y="300" font-size="36" fill="#1F2933">Aggiunge numeri in fondo, in ordine di tempo.</text>

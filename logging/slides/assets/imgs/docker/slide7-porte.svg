<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="72" font-size="40" font-weight="bold" fill="#1F2933">Un negozio per ciascuno: nginx e le porte</text>
  <text x="60" y="110" font-size="22" fill="#52606D">-p PORTA_ESTERNA:PORTA_INTERNA. Ognuno usa la porta 8000 + il suo numero (qui il numero 7)</text>

  <!-- Browser -->
  <rect x="60" y="200" width="270" height="130" rx="10" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
  <rect x="60" y="200" width="270" height="30" rx="10" fill="#CBD2D9"/><rect x="60" y="218" width="270" height="12" fill="#CBD2D9"/>
  <circle cx="80" cy="215" r="5" fill="#E12D39"/><circle cx="96" cy="215" r="5" fill="#F0B429"/><circle cx="112" cy="215" r="5" fill="#27AB83"/>
  <rect x="72" y="242" width="246" height="28" rx="5" fill="#F5F7FA" stroke="#9AA5B1"/>
  <text x="80" y="262" font-size="14" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">http://IP-del-VPS:8007</text>
  <text x="195" y="310" font-size="20" font-weight="bold" fill="#3E4C59" text-anchor="middle">il tuo browser</text>

  <path d="M335,265 L600,265" stroke="#0C8599" stroke-width="5" fill="none" marker-end="url(#aT)"/>
  <text x="468" y="250" font-size="18" font-weight="bold" fill="#0C8599" text-anchor="middle">porta 8007</text>

  <!-- VPS -->
  <rect x="620" y="150" width="920" height="320" rx="14" fill="#F5F7FA" stroke="#1F2933" stroke-width="4"/>
  <text x="650" y="188" font-size="24" font-weight="bold" fill="#1F2933">VPS del corso</text>
  <text x="650" y="214" font-size="17" fill="#52606D">il centro commerciale (un indirizzo IP)</text>
  <!-- porta facciata -->
  <rect x="600" y="240" width="110" height="50" rx="8" fill="#0C8599"/>
  <text x="655" y="273" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">:8007</text>
  <!-- docker-proxy -->
  <rect x="770" y="235" width="210" height="60" rx="8" fill="#FFFFFF" stroke="#0C8599" stroke-width="3"/>
  <text x="875" y="263" font-size="18" font-weight="bold" fill="#0C8599" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">docker-proxy</text>
  <text x="875" y="285" font-size="14" fill="#52606D" text-anchor="middle">chi ascolta davvero</text>
  <path d="M712,265 L766,265" stroke="#0C8599" stroke-width="5" fill="none" marker-end="url(#aT)"/>
  <path d="M982,265 L1066,265" stroke="#0C8599" stroke-width="5" fill="none" marker-end="url(#aT)"/>
  <!-- container -->
  <rect x="1070" y="190" width="440" height="250" rx="12" fill="#E3F6E8" stroke="#2F9E44" stroke-width="3" stroke-dasharray="12 7"/>
  <text x="1290" y="225" font-size="22" font-weight="bold" fill="#2F9E44" text-anchor="middle">container web-07</text>
  <rect x="1100" y="240" width="70" height="50" rx="8" fill="#2F9E44"/>
  <text x="1135" y="273" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">:80</text>
  <rect x="1190" y="240" width="290" height="50" rx="8" fill="#FFFFFF" stroke="#3E4C59" stroke-width="2"/>
  <text x="1335" y="272" font-size="20" font-weight="bold" fill="#3E4C59" text-anchor="middle">nginx (server web)</text>
  <text x="1100" y="330" font-size="17" fill="#3E4C59">Dentro il container nginx ascolta sulla 80,</text>
  <text x="1100" y="356" font-size="17" fill="#3E4C59">come sempre. Non sa nulla della 8007.</text>
  <text x="1100" y="395" font-size="17" fill="#3E4C59">Altri container possono usare la loro 80:</text>
  <text x="1100" y="421" font-size="17" fill="#3E4C59">sono negozi diversi.</text>
  <text x="650" y="350" font-size="17" fill="#3E4C59">Fuori, la 8007 è una sola:</text>
  <text x="650" y="376" font-size="17" fill="#3E4C59">se la prende un compagno,</text>
  <text x="650" y="402" font-size="17" fill="#3E4C59">il tuo run fallisce.</text>

  <!-- Terminale -->
  <rect x="60" y="500" width="1000" height="360" rx="12" fill="#1F2933"/>
  <g font-size="17" font-family="DejaVu Sans Mono, monospace">
    <text xml:space="preserve" x="85" y="538" fill="#FFFFFF">$ docker run -d --name web-07 -p 8007:80 nginx:alpine</text>
    <text xml:space="preserve" x="85" y="566" fill="#9FB3C8">3f9c1e0a7b2d...   # -d: in background, torna subito il prompt</text>
    <text xml:space="preserve" x="85" y="608" fill="#FFFFFF">$ docker ps</text>
    <text xml:space="preserve" x="85" y="636" fill="#9FB3C8">CONTAINER ID   IMAGE          STATUS         PORTS                  NAMES</text>
    <text xml:space="preserve" x="85" y="664" fill="#9FB3C8">3f9c1e0a7b2d   nginx:alpine   Up 5 seconds   0.0.0.0:8007-&gt;80/tcp   web-07</text>
    <text xml:space="preserve" x="85" y="706" fill="#FFFFFF">$ curl -I http://localhost:8007</text>
    <text xml:space="preserve" x="85" y="734" fill="#7BC47F">HTTP/1.1 200 OK</text>
    <text xml:space="preserve" x="85" y="762" fill="#9FB3C8">Server: nginx</text>
    <text xml:space="preserve" x="85" y="804" fill="#FFFFFF">$ docker run -d --name web-07b -p 8007:80 nginx:alpine</text>
    <text xml:space="preserve" x="85" y="832" fill="#FF8787">Error ... Bind for 0.0.0.0:8007 failed: port is already allocated</text>
  </g>

  <!-- Note -->
  <rect x="1090" y="500" width="450" height="360" rx="12" fill="#FCE8EC" stroke="#C2255C" stroke-width="2"/>
  <text x="1115" y="540" font-size="20" font-weight="bold" fill="#C2255C">Attenzione: è su Internet</text>
  <g font-size="17" fill="#3E4C59">
    <text x="1115" y="575">Una porta pubblicata con -p è</text>
    <text x="1115" y="600">aperta a tutto il mondo, anche se</text>
    <text x="1115" y="625">il firewall ufw dice di no:</text>
    <text x="1115" y="650">Docker scrive le sue regole prima.</text>
    <text x="1115" y="695">Solo dal server stesso:</text>
  </g>
  <text x="1115" y="725" font-size="16" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">-p 127.0.0.1:8007:80</text>
  <g font-size="17" fill="#3E4C59">
    <text x="1115" y="770">Fine lezione: pulizia.</text>
  </g>
  <text x="1115" y="800" font-size="16" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">docker rm -f web-07</text>
</svg>

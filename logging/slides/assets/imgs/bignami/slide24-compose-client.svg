<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C64C8"/></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2496ED"/>
<text xml:space="preserve" x="70" y="100" font-size="52" fill="#1F2933" font-weight="bold">compose.yml del PC</text>
<text xml:space="preserve" x="70" y="152" font-size="27" fill="#52606D">Alloy, che spedisce a Loki e a Prometheus</text>
<rect x="70" y="175" width="820" height="661" rx="14" fill="#FFFFFF" stroke="#3E4C59" stroke-width="3"/>
<text xml:space="preserve" x="102" y="214" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">services:</text>
<text xml:space="preserve" x="102" y="247" font-size="19" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">  alloy:</text>
<text xml:space="preserve" x="102" y="280" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    image: grafana/alloy:v1.20.1</text>
<text xml:space="preserve" x="102" y="313" font-size="19" fill="#B7791F" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    hostname: mario-rossi</text>
<text xml:space="preserve" x="102" y="346" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    command:</text>
<text xml:space="preserve" x="102" y="379" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - run</text>
<text xml:space="preserve" x="102" y="412" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - --server.http.listen-addr=0.0.0.0:12345</text>
<text xml:space="preserve" x="102" y="445" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - --storage.path=/var/lib/alloy/data</text>
<text xml:space="preserve" x="102" y="478" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - /etc/alloy/config.alloy</text>
<text xml:space="preserve" x="102" y="511" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">    volumes:</text>
<text xml:space="preserve" x="102" y="544" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro</text>
<text xml:space="preserve" x="102" y="577" font-size="19" fill="#1C64C8" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - /var/log:/var/log:ro</text>
<text xml:space="preserve" x="102" y="610" font-size="19" fill="#C92A2A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - /proc:/host/proc:ro</text>
<text xml:space="preserve" x="102" y="643" font-size="19" fill="#C92A2A" font-weight="bold" font-family="DejaVu Sans Mono, monospace">      - /sys:/host/sys:ro</text>
<text xml:space="preserve" x="102" y="676" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">      - alloy-data:/var/lib/alloy/data</text>
<text xml:space="preserve" x="102" y="709" font-size="19" fill="#0C8599" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    ports: ["127.0.0.1:12345:12345"]</text>
<text xml:space="preserve" x="102" y="742" font-size="19" fill="#2F9E44" font-weight="bold" font-family="DejaVu Sans Mono, monospace">    restart: unless-stopped</text>
<text xml:space="preserve" x="102" y="775" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">volumes:</text>
<text xml:space="preserve" x="102" y="808" font-size="19" fill="#1F2933" font-family="DejaVu Sans Mono, monospace">  alloy-data:</text>
<text xml:space="preserve" x="930" y="313" font-size="26" fill="#B7791F" font-weight="bold">← diventa l'etichetta host</text>
<text xml:space="preserve" x="930" y="478" font-size="26" fill="#3E4C59" font-weight="bold">← config.alloy dice dove</text>
<text xml:space="preserve" x="960" y="514" font-size="26" fill="#3E4C59" font-weight="bold">spedire log e metriche</text>
<text xml:space="preserve" x="930" y="577" font-size="26" fill="#1C64C8" font-weight="bold">← i log da leggere</text>
<text xml:space="preserve" x="930" y="626.5" font-size="26" fill="#C92A2A" font-weight="bold">← le metriche del PC</text>
<text xml:space="preserve" x="930" y="709" font-size="26" fill="#0C8599" font-weight="bold">← solo la pagina di stato,</text>
<text xml:space="preserve" x="960" y="745" font-size="26" fill="#0C8599" font-weight="bold">visibile solo dal PC</text>
<text xml:space="preserve" x="930" y="812" font-size="26" fill="#1F2933" font-weight="bold">Nessuna porta in ingresso:</text>
<text xml:space="preserve" x="930" y="848" font-size="26" fill="#1F2933">è Alloy che apre la connessione.</text>
</svg>
